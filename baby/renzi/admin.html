<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>汉字小侦探 · 家长管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235E7185'/%3E%3Ctext x='32' y='45' font-size='40' text-anchor='middle' fill='%23fff' font-family='Kaiti SC,serif'%3E字%3C/text%3E%3C/svg%3E">
<style>
/* ===========================================================
   汉字小侦探 · 家长端样式（admin.html）
   简洁的管理后台风格，桌面与手机都能用。
   =========================================================== */

:root{
  --know:#F08C1E; --know-soft:#FFF1DC; --know-line:#F5B95C; --know-deep:#C67A11;
  --unk:#5E7185;  --unk-soft:#EDF2F7;  --unk-line:#9FB3C8;  --unk-deep:#455A6E;
  --par:#3E9E7C;  --par-soft:#E9F6F1; --par-line:#8FD0BA; --par-deep:#2C7A5E;
  --ink:#2C2824; --ink-2:#6B625A; --ink-3:#9C928A;
  --bg:#F7F5F2; --panel:#FFFFFF; --line:rgba(44,40,36,.12);
  --r-sm:10px; --r-md:14px; --r-lg:20px;
  --shadow:0 6px 24px rgba(80,60,30,.08);
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-hanzi:"Kaiti SC","STKaiti","KaiTi","Kaiti TC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);
  -webkit-text-size-adjust:100%;line-height:1.5;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,p{margin:0}
a{color:var(--know-deep)}

/* ---------------- 登录 ---------------- */
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.login-box{
  width:min(400px,100%);background:#fff;border-radius:var(--r-lg);padding:34px 30px;
  box-shadow:0 12px 40px rgba(80,60,30,.12);border:1px solid var(--line);text-align:center;
}
.login-box .badge{
  width:62px;height:62px;border-radius:20px;margin:0 auto 16px;display:grid;place-items:center;
  background:linear-gradient(180deg,#FFC46B,#F08C1E);box-shadow:0 10px 24px rgba(240,140,30,.34);
}
.login-box .badge span{font-family:var(--font-hanzi);font-size:36px;color:#fff;margin-top:4px}
.login-box h1{font-size:22px}
.login-box .sub{font-size:13px;color:var(--ink-3);margin-top:6px}
.login-box .field{margin-top:22px;text-align:left}
.login-box label{font-size:13px;color:var(--ink-2);font-weight:600}
.input{
  width:100%;margin-top:7px;padding:12px 14px;font-size:16px;font-family:inherit;
  border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink);
  transition:border-color .15s ease,box-shadow .15s ease;
}
.input:focus{outline:none;border-color:var(--know-line);box-shadow:0 0 0 3px rgba(240,140,30,.14)}
.login-box .btn{width:100%;margin-top:18px;justify-content:center}
.login-err{color:#B03A2E;font-size:13px;margin-top:12px;min-height:18px}

/* ---------------- 通用 ---------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  padding:.7em 1.3em;border-radius:999px;font-size:15px;font-weight:600;
  background:#fff;border:1.5px solid var(--line);
  transition:transform .12s ease,box-shadow .18s ease,background .18s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(80,60,30,.10)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#FFB251,#F08C1E);color:#fff;border-color:transparent}
.btn.ghost{background:rgba(255,255,255,.75)}
.btn.sm{font-size:13.5px;padding:.5em 1em}
.btn.danger{color:#B03A2E;border-color:rgba(176,58,46,.35)}
.btn.danger:hover{background:#FDF0EE}
.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;box-shadow:var(--shadow)}
.tip{font-size:13px;color:var(--ink-3);line-height:1.65}
.muted{color:var(--ink-3)}
.hidden{display:none !important}

/* ---------------- 顶栏 ---------------- */
.top{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.top .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(180deg,#FFC46B,#F08C1E)}
.top .logo span{font-family:var(--font-hanzi);font-size:23px;color:#fff;margin-top:3px}
.top .tt{font-size:16.5px;font-weight:700;white-space:nowrap}
.top .tt small{font-weight:400;color:var(--ink-3);font-size:12.5px;margin-left:8px}
.top .sp{flex:1}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.pill{
  font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:#fff;
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.pill b{font-weight:700}
.pill.know{border-color:var(--know-line);background:var(--know-soft);color:var(--know-deep)}
.pill.unk{border-color:var(--unk-line);background:var(--unk-soft);color:var(--unk-deep)}
button.pill{transition:transform .12s,box-shadow .15s}
button.pill:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(80,60,30,.12)}

/* ---------------- 主体 ---------------- */
.wrap{max-width:1080px;margin:0 auto;padding:20px 20px 60px;display:flex;flex-direction:column;gap:16px}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{
  padding:.6em 1.2em;border-radius:999px;font-size:14.5px;font-weight:600;
  border:1.5px solid var(--line);background:#fff;
}
.tab.on{border-color:var(--know);background:var(--know-soft);color:var(--know-deep)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .input{width:auto;margin-top:0;padding:9px 13px;font-size:14.5px}
.toolbar .search{flex:1;min-width:160px}
select.input{width:auto;padding:9px 11px;font-size:14.5px}

/* 分组标签卡：点一下直接看这一类，不用再选筛选条件 */
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{
  display:flex;align-items:center;gap:8px;
  padding:9px 15px;border-radius:var(--r-sm);
  border:1.5px solid var(--line);background:#fff;
  font-size:14px;font-weight:600;color:var(--ink-2);
  transition:background .15s,border-color .15s,box-shadow .15s,transform .12s,opacity .15s;
}
.chip .ct{white-space:nowrap}
.chip .cn{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1}
.chip:hover{border-color:var(--ink-3);transform:translateY(-1px);box-shadow:0 4px 12px rgba(80,60,30,.1)}
.chip:focus-visible{outline:2px solid var(--know);outline-offset:2px}
.chip.zero{opacity:.5}

.chip.g-untested{background:#FBFAF8}
.chip.g-all,.chip.g-seed{background:#fff}

.chip.g-known{border-color:var(--know-line);background:var(--know-soft)}
.chip.g-known .ct,.chip.g-known .cn{color:var(--know-deep)}
.chip.g-unknown{border-color:var(--unk-line);background:var(--unk-soft)}
.chip.g-unknown .ct,.chip.g-unknown .cn{color:var(--unk-deep)}
.chip.g-parent{border-color:var(--par-line);background:var(--par-soft)}
.chip.g-parent .ct,.chip.g-parent .cn{color:var(--par-deep)}

/* 选中：整块填充，一眼看清当前在看哪一类 */
.chip.on{color:#fff;box-shadow:0 6px 16px rgba(80,60,30,.18)}
.chip.on .ct,.chip.on .cn{color:#fff}
.chip.g-known.on{background:var(--know);border-color:var(--know)}
.chip.g-unknown.on{background:var(--unk);border-color:var(--unk)}
.chip.g-parent.on{background:var(--par);border-color:var(--par)}
.chip.g-untested.on{background:var(--ink-2);border-color:var(--ink-2)}
.chip.g-seed.on{background:#8A8178;border-color:#8A8178}
.chip.g-all.on{background:var(--ink);border-color:var(--ink)}

/* ---------------- 识字总览看板 ---------------- */
.dash-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.dash-head h2{font-size:16.5px;font-weight:700}
.dash-head .sub{font-size:12.5px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}
.dash-head .sub b{color:var(--ink-2);font-weight:700}
.dash-head .rate{margin-left:auto;text-align:right}
.dash-head .rate b{font-size:28px;font-weight:800;color:var(--know-deep);font-variant-numeric:tabular-nums;line-height:1}
.dash-head .rate span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px}
.dash-bar{height:10px;border-radius:999px;background:rgba(44,40,36,.08);overflow:hidden;display:flex;margin-bottom:16px}
.dash-bar i{display:block;height:100%;transition:width .3s ease}
.dash-bar .b1{background:linear-gradient(90deg,#FFC46B,#F08C1E)}
.dash-bar .b2{background:linear-gradient(90deg,#9FB3C8,#5E7185)}
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.dash-item{
  text-align:left;width:100%;border:1.5px solid var(--line);border-radius:var(--r-md);background:#fff;
  padding:14px 15px;transition:transform .12s ease,box-shadow .15s ease,border-color .15s ease;
}
.dash-item:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(80,60,30,.12)}
.dash-item:active{transform:scale(.985)}
.dash-item .k{font-size:12.5px;color:var(--ink-3)}
.dash-item .v{font-size:30px;font-weight:800;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.dash-item .v small{font-size:13px;font-weight:600;color:var(--ink-3);margin-left:3px}
.dash-item .u{font-size:11.5px;color:var(--ink-3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-item.d-total .v{color:var(--ink)}
.dash-item.d-known{border-color:var(--know-line);background:linear-gradient(180deg,#FFFAF2,#fff)}
.dash-item.d-known .v{color:var(--know-deep)}
.dash-item.d-unknown{border-color:var(--unk-line);background:linear-gradient(180deg,#F8FAFC,#fff)}
.dash-item.d-unknown .v{color:var(--unk-deep)}
.dash-item.d-untested .v{color:var(--ink-2)}
.dash-tip{font-size:12px;color:var(--ink-3);margin-top:12px}

/* 字库列表 */
.chr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.chr{
  background:#fff;border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 14px;
  display:flex;align-items:flex-start;gap:12px;
}
.chr.k{border-color:var(--know-line);background:linear-gradient(180deg,#FFFBF5,#fff)}
.chr.u{border-color:var(--unk-line)}
.chr .hz{font-family:var(--font-hanzi);font-size:40px;line-height:1;flex:0 0 auto;color:#26221E}
.chr .meta{flex:1;min-width:0}
.chr .py{font-size:14px;color:var(--unk);font-weight:600}
.chr .wd{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.5;word-break:break-all}
.chr .tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--ink-3);background:#fff}
.tag.know{color:var(--know-deep);border-color:var(--know-line);background:var(--know-soft);font-weight:700}
.tag.unk{color:var(--unk-deep);border-color:var(--unk-line);background:var(--unk-soft);font-weight:700}
.tag.untested{color:var(--ink-3)}
.tag.parent{color:#8A6BD1;border-color:#D9CCF5;background:#F4EFFD}
.tag.seed{color:#6B625A}
.chr .acts{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.iconbtn{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;font-size:14px;color:var(--ink-2);
}
.iconbtn:hover{background:#F7F3ED}
.iconbtn.del:hover{background:#FDF0EE;color:#B03A2E;border-color:rgba(176,58,46,.35)}

.pager{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.pager .info{font-size:13px;color:var(--ink-3)}

/* 新增字（页面首位的独立模块，无预览卡片） */
.state-picker{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.state-opt{
  flex:1 1 0;min-width:104px;border:2px solid var(--line);border-radius:var(--r-md);
  padding:12px;text-align:center;background:#fff;transition:.15s;
}
.state-opt .t{font-size:14.5px;font-weight:700}
.state-opt .d{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.state-opt.on{border-color:var(--know);background:var(--know-soft)}
.state-opt.on.unk{border-color:var(--unk);background:var(--unk-soft)}
.state-opt.on.none{border-color:#8A6BD1;background:#F4EFFD}

.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:13px;color:var(--ink-2);font-weight:600;margin-bottom:6px}

/* 进度条 */
.bar{height:10px;border-radius:999px;background:rgba(44,40,36,.08);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b1{background:linear-gradient(90deg,#FFC46B,#F08C1E)}
.bar .b2{background:linear-gradient(90deg,#9FB3C8,#5E7185)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:#2C2824;color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;z-index:100;
  box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 确认层 */
.overlay{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(30,24,18,.5);padding:18px}
.overlay .box{background:#fff;border-radius:var(--r-lg);padding:26px 28px;max-width:440px;width:100%;
  box-shadow:0 30px 70px rgba(0,0,0,.3)}
.overlay h2{font-size:18px;margin-bottom:8px}
.overlay p{font-size:14px;color:var(--ink-2);line-height:1.75}
.overlay .foot{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

.empty{text-align:center;padding:40px 20px;color:var(--ink-3);font-size:14px}

@media (max-width:820px){
  .top .tt small{display:none}
  .dash-grid{grid-template-columns:repeat(2,1fr)}
  .dash-head .rate{width:100%;margin-left:0;text-align:left}
}
@media (max-width:560px){
  .wrap{padding:14px 14px 50px}
  .top-in{padding:10px 14px}
  .chr-list{grid-template-columns:1fr}
  .login-box{padding:26px 20px}
  .chips{gap:8px}
  .chip{padding:8px 12px;font-size:13.5px;gap:6px}
  .chip .cn{font-size:15.5px}
  .dash-grid{gap:9px}
  .dash-item{padding:11px 12px}
  .dash-item .v{font-size:24px}
  .dash-item .u{font-size:11px}
  .dash-head .rate b{font-size:23px}
}

</style>
</head>
<body>

<div id="login"></div>

<div id="app" class="hidden">
  <header class="top"><div class="top-in" id="topIn"></div></header>
  <main class="wrap" id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>window.__API_BASE__ = "/api/baby";</script>
<script>
/* ===========================================================
   汉字小侦探 · 家长端（admin.html）

   功能：
   1) 口令登录（口令存在后端 D1，默认 momo2026，可在此页修改）
   2) 识字总览看板（页面顶部，各标签页都可见）：字库总数 / 已经认识 / 需要练习 / 尚未测试，
      点任意一块直接跳到字库对应分组
   3) 字库：分组标签卡（全部 / 认识 / 不认识 / 未测 / 家长添加 / 自带字库），
      点一下直接看这一类，不用再手选筛选条件；每个分组里都带检索框，可按汉字或拼音查
   4) 新增汉字：固定在页面首位的独立模块（无预览卡片）；
      输入即自动补全拼音与组词；
      · 字库中还没有 → 新增（标为家长添加）
      · 字库中已有   → 按你选的「是否认识」更新它的状态（不重复加字）
   5) 设置：改口令 / 重置全部进度 / 重置某个字
   孩子端 index.html 里不放任何入口。
   =========================================================== */
(function () {
  'use strict';

  var API_BASE = (window.__API_BASE__ != null) ? window.__API_BASE__ : '/api/baby';
  var TOKEN_KEY = 'hzdet2.adminToken';

  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function el(tag, cls, html) { var d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]; }); }

  var token = '';
  try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { token = ''; }

  /* ---------------- 网络 ---------------- */
  function api(method, path, body) {
    var headers = { 'Accept': 'application/json' };
    if (body) headers['Content-Type'] = 'application/json';
    if (token) headers['Authorization'] = 'Bearer ' + token;
    return fetch(API_BASE + path, {
      method: method, headers: headers, body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: 'HTTP ' + r.status }; }).then(function (j) {
        if (r.status === 401) {
          setToken('');
          var app = document.getElementById('app');
          if (app && !app.classList.contains('hidden')) gotoLogin(j.error || '登录已过期，请重新登录');
          throw new Error(j.error || '登录已过期，请重新登录');
        }
        if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  function setToken(t) {
    token = t || '';
    try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) { }
  }
  function gotoLogin(msg) {
    var app = document.getElementById('app');
    if (app) app.classList.add('hidden');
    renderLogin(msg);
  }

  /* ---------------- 小工具 ---------------- */
  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2200);
  }
  function confirmBox(opt) {
    return new Promise(function (resolve) {
      var ov = el('div', 'overlay');
      ov.innerHTML = '<div class="box"><h2>' + esc(opt.title || '请确认') + '</h2><p>' + (opt.body || '') + '</p>' +
        '<div class="foot"><button class="btn ghost" data-x="0">' + esc(opt.cancel || '取消') + '</button>' +
        '<button class="btn ' + (opt.danger ? 'danger' : 'primary') + '" data-x="1">' + esc(opt.ok || '确定') + '</button></div></div>';
      document.body.appendChild(ov);
      ov.addEventListener('click', function (e) {
        var b = e.target.closest('[data-x]');
        if (b) { ov.remove(); resolve(b.dataset.x === '1'); }
        else if (e.target === ov) { ov.remove(); resolve(false); }
      });
    });
  }

  /* ---------------- 状态 ---------------- */
  // 字库分组：直接点标签卡切换，不用再手选筛选条件。
  // 每张卡映射到后端的一个 (status, source) 组合；nk 是它在 stats 里的计数字段。
  var GROUPS = [
    { k: 'all',      t: '全部',     cls: 'g-all',      status: 'all',      source: 'all',    nk: 'total' },
    { k: 'known',    t: '认识',     cls: 'g-known',    status: 'known',    source: 'all',    nk: 'known' },
    { k: 'unknown',  t: '不认识',   cls: 'g-unknown',  status: 'unknown',  source: 'all',    nk: 'unknown' },
    { k: 'untested', t: '未测',     cls: 'g-untested', status: 'untested', source: 'all',    nk: 'untested' },
    { k: 'parent',   t: '家长添加', cls: 'g-parent',   status: 'all',      source: 'parent', nk: 'parent' },
    { k: 'seed',     t: '自带字库', cls: 'g-seed',     status: 'all',      source: 'seed',   nk: 'seed' }
  ];
  function groupOf(k) {
    for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].k === k) return GROUPS[i];
    return GROUPS[0];
  }

  var S = {
    tab: 'chars',
    stats: {},
    parentChars: 0,
    list: [], total: 0, page: 1, size: 48, q: '',
    group: 'all',
    lookup: null, lookupState: 'known',
    addFocused: false,
    ready: false
  };

  /* ===========================================================
     登录页
     =========================================================== */
  function renderLogin(errMsg) {
    $('#app').classList.add('hidden');
    var box = $('#login');
    box.classList.remove('hidden');
    box.innerHTML =
      '<div class="login-box">' +
        '<div class="badge"><span>字</span></div>' +
        '<h1>家长管理</h1>' +
        '<div class="sub">汉字小侦探 · 字库与进度管理</div>' +
        '<div class="field"><label for="pw">口令</label>' +
          '<input class="input" id="pw" type="password" inputmode="text" autocomplete="current-password" placeholder="请输入家长口令">' +
        '</div>' +
        '<button class="btn primary" id="loginBtn">登录</button>' +
        '<div class="login-err" id="loginErr">' + (errMsg ? esc(errMsg) : '') + '</div>' +
      '</div>';

    var pw = $('#pw');
    function go() {
      var v = pw.value.trim();
      if (!v) { $('#loginErr').textContent = '请输入口令'; return; }
      $('#loginBtn').disabled = true;
      $('#loginErr').textContent = '正在登录…';
      api('POST', '/admin/login', { password: v }).then(function (res) {
        setToken(res.token);
        toast('登录成功');
        boot();
      }).catch(function (e) {
        $('#loginBtn').disabled = false;
        $('#loginErr').textContent = e.message || '登录失败';
        pw.select();
      });
    }
    $('#loginBtn').addEventListener('click', go);
    pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    setTimeout(function () { pw.focus(); }, 120);
  }

  /* ===========================================================
     主界面
     =========================================================== */
  function renderTop() {
    $('#topIn').innerHTML =
      '<div class="logo"><span>字</span></div>' +
      '<div class="tt">家长管理<small>汉字小侦探</small></div>' +
      '<div class="sp"></div>' +
      '<button class="btn sm ghost" id="logoutBtn">退出</button>';
    $('#logoutBtn').addEventListener('click', function () {
      confirmBox({ title: '退出登录？', body: '退出后需要重新输入口令。', ok: '退出' }).then(function (y) {
        if (!y) return;
        api('POST', '/admin/logout', {}).catch(function () { }).then(function () {
          setToken(''); gotoLogin('已退出登录');
        });
      });
    });
  }

  /* ---------------- 识字总览看板 ----------------
     四个数：字库总数 / 已经认识 / 需要练习 / 尚未测试。
     每块都能点，直接跳到字库的对应分组。 */
  function renderDash() {
    var st = S.stats || {};
    var total = st.total || 0, known = st.known || 0, unknown = st.unknown || 0, untested = st.untested || 0;
    var parent = (typeof st.parent === 'number') ? st.parent : (S.parentChars || 0);
    var seed = (typeof st.seed === 'number') ? st.seed : Math.max(0, total - parent);
    var tested = known + unknown;
    var rate = total ? (known / total * 100) : 0;
    var kw = total ? (known / total * 100) : 0;
    var uw = total ? (unknown / total * 100) : 0;

    function pct(n) { return total ? (n / total * 100).toFixed(1) + '%' : '—'; }
    function tile(cls, lab, n, sub, goto) {
      return '<button class="dash-item ' + cls + '" data-goto="' + goto + '" title="点一下看这一类">' +
        '<div class="k">' + lab + '</div>' +
        '<div class="v">' + n + '<small>字</small></div>' +
        '<div class="u">' + sub + '</div>' +
      '</button>';
    }

    return '<div class="card dash">' +
      '<div class="dash-head">' +
        '<div>' +
          '<h2>识字总览</h2>' +
          '<div class="sub">已测 <b>' + tested + '</b> 字　·　还有 <b>' + untested + '</b> 字没测' +
            (parent ? '　·　家长添加 <b>' + parent + '</b> 字' : '') + '</div>' +
        '</div>' +
        '<div class="rate"><b>' + rate.toFixed(1) + '%</b><span>识字率（认识 ÷ 字库总数）</span></div>' +
      '</div>' +
      '<div class="dash-bar"><i class="b1" style="width:' + kw + '%"></i><i class="b2" style="width:' + uw + '%"></i></div>' +
      '<div class="dash-grid">' +
        tile('d-total',    '字库总数', total,    '内置 ' + seed + ' · 家长添加 ' + parent, 'all') +
        tile('d-known',    '已经认识', known,    pct(known),                              'known') +
        tile('d-unknown',  '需要练习', unknown,  pct(unknown),                            'unknown') +
        tile('d-untested', '尚未测试', untested, pct(untested),                           'untested') +
      '</div>' +
      '<div class="dash-tip">点任意一块，直接跳到字库里对应的分组</div>' +
    '</div>';
  }

  function bindGoto(scope) {
    $$('[data-goto]', scope || document).forEach(function (b) {
      b.addEventListener('click', function () {
        S.tab = 'chars'; S.group = b.dataset.goto; S.page = 1; S.q = '';
        renderMain();
        var v = $('#view');
        if (v && v.scrollIntoView) v.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  function paintDash() {
    var box = $('#dashBox');
    if (!box) return;
    box.innerHTML = renderDash();
    bindGoto(box);
  }

  // 统计变化后统一刷新：顶栏 + 看板 + 分组标签卡
  function refreshStats() { renderTop(); paintDash(); }

  function renderTabs() {
    var tabs = [['chars', '字库'], ['settings', '设置']];
    return '<div class="tabs">' + tabs.map(function (t) {
      return '<button class="tab ' + (S.tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>';
  }

  function renderMain() {
    var m = $('#main');
    // 新增汉字固定为页面首位的独立模块，识字总览看板在其后
    m.innerHTML = '<div id="addBox"></div><div id="dashBox"></div>' + renderTabs() + '<div id="view"></div>';
    renderAdd();
    paintDash();
    $$('[data-tab]', m).forEach(function (b) {
      b.addEventListener('click', function () { S.tab = b.dataset.tab; renderMain(); });
    });
    if (S.tab === 'chars') renderChars();
    else renderSettings();
  }

  /* ---------------- 字库视图 ---------------- */
  function statusTag(s) {
    if (s === 'known') return '<span class="tag know">认识</span>';
    if (s === 'unknown') return '<span class="tag unk">不认识</span>';
    return '<span class="tag untested">未测</span>';
  }

  function renderChars() {
    var v = $('#view');
    v.innerHTML =
      '<div class="card">' +
        '<div class="chips" id="chips"></div>' +
        '<div class="toolbar">' +
          '<input class="input search" id="q" placeholder="检索汉字或拼音（如 木 / mu），在选中的分组里查找" value="' + esc(S.q) + '">' +
          '<button class="btn sm ghost" id="reloadBtn">刷新</button>' +
        '</div>' +
        '<div id="chrBox"></div>' +
        '<div class="pager" id="pager"></div>' +
      '</div>';

    paintChips();

    $('#q').addEventListener('input', debounce(function (e) { S.q = e.target.value.trim(); S.page = 1; loadChars(); }, 280));
    $('#reloadBtn').addEventListener('click', function () { loadChars(); });

    loadChars();
  }

  // 标签卡：显示分组名 + 数量（为 0 的置灰，一眼看出是空的）
  function paintChips() {
    var box = $('#chips'); if (!box) return;
    var st = S.stats || {};
    box.innerHTML = GROUPS.map(function (g) {
      var n = st[g.nk];
      n = (typeof n === 'number') ? n : 0;
      return '<button class="chip ' + g.cls + (S.group === g.k ? ' on' : '') + (n ? '' : ' zero') + '" data-g="' + g.k + '">' +
        '<span class="ct">' + g.t + '</span><b class="cn">' + n + '</b>' +
      '</button>';
    }).join('');
    $$('.chip', box).forEach(function (b) {
      b.addEventListener('click', function () {
        if (S.group === b.dataset.g) return;
        S.group = b.dataset.g; S.page = 1;
        paintChips();
        loadChars();
      });
    });
  }

  var loadSeq = 0;   // 连点标签卡时，丢弃过期响应，避免旧结果覆盖新分组
  function loadChars() {
    var box = $('#chrBox'); if (!box) return;
    var seq = ++loadSeq;
    box.innerHTML = '<div class="empty">加载中…</div>';
    var g = groupOf(S.group);
    var qs = '?q=' + encodeURIComponent(S.q) + '&status=' + g.status + '&source=' + g.source + '&page=' + S.page + '&size=' + S.size;
    api('GET', '/admin/chars' + qs).then(function (res) {
      if (seq !== loadSeq) return;
      S.list = res.list || []; S.total = res.total || 0; S.page = res.page; S.size = res.size;
      if (res.stats) { S.stats = res.stats; refreshStats(); paintChips(); }
      paintChars();
    }).catch(function (e) {
      if (seq !== loadSeq) return;
      box.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
    });
  }

  // 空结果时给出有针对性的说明，而不是一句「没有符合条件的字」
  function emptyHint() {
    if (S.q && S.group !== 'all') {
      return '「' + esc(groupOf(S.group).t) + '」里没有匹配「' + esc(S.q) + '」的字。' +
        '<br><button class="btn sm ghost" id="searchAllBtn" style="margin-top:12px">到「全部」里搜一搜</button>';
    }
    if (S.q) return '没有匹配「' + esc(S.q) + '」的字。';
    if (S.group === 'known') return '还没有标为「认识」的字。孩子答题时向左滑就会归到这里。';
    if (S.group === 'unknown') return '还没有标为「不认识」的字。孩子答题时向右滑就会归到这里。';
    if (S.group === 'untested') return '所有字都测过了，没有未测的字了。';
    if (S.group === 'parent') return '还没有家长手动添加的字，用页面顶部的「新增汉字」模块加一个。';
    return '没有符合条件的字。';
  }

  function paintChars() {
    var box = $('#chrBox');
    if (!S.list.length) {
      box.innerHTML = '<div class="empty">' + emptyHint() + '</div>';
      $('#pager').innerHTML = '';
      var sa = $('#searchAllBtn');
      if (sa) sa.addEventListener('click', function () { S.group = 'all'; S.page = 1; paintChips(); loadChars(); });
      return;
    }
    box.innerHTML = '<div class="chr-list">' + S.list.map(function (r) {
      var cls = r.status === 'known' ? 'k' : (r.status === 'unknown' ? 'u' : '');
      return '<div class="chr ' + cls + '" data-h="' + esc(r.hanzi) + '">' +
        '<div class="hz">' + esc(r.hanzi) + '</div>' +
        '<div class="meta">' +
          '<div class="py">' + esc(r.pinyin || '—') + ' <span class="muted" style="font-size:11.5px">' + (r.strokes || 0) + '画</span></div>' +
          '<div class="wd">' + (r.words && r.words.length ? esc(r.words.slice(0, 4).join(' · ')) : '<span class="muted">（无组词）</span>') + '</div>' +
          '<div class="tags">' + statusTag(r.status) +
            '<span class="tag ' + (r.source === 'parent' ? 'parent' : 'seed') + '">' + (r.source === 'parent' ? '家长添加' : '内置') + '</span>' +
            (r.knownCount || r.unknownCount ? '<span class="tag">答对' + r.knownCount + '/答错' + r.unknownCount + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="acts">' +
          '<button class="iconbtn" data-act="know" title="标为认识">✓</button>' +
          '<button class="iconbtn" data-act="unknown" title="标为不认识">?</button>' +
          '<button class="iconbtn" data-act="reset" title="重置为未测">↺</button>' +
          (r.source === 'parent' ? '<button class="iconbtn del" data-act="del" title="删除">✕</button>' : '') +
        '</div>' +
      '</div>';
    }).join('') + '</div>';

    var totalPages = Math.max(1, Math.ceil(S.total / S.size));
    $('#pager').innerHTML = '<button class="btn sm ghost" id="pPrev"' + (S.page <= 1 ? ' disabled' : '') + '>上一页</button>' +
      '<span class="info">第 ' + S.page + ' / ' + totalPages + ' 页　共 ' + S.total + ' 个字</span>' +
      '<button class="btn sm ghost" id="pNext"' + (S.page >= totalPages ? ' disabled' : '') + '>下一页</button>';
    $('#pPrev').addEventListener('click', function () { if (S.page > 1) { S.page--; loadChars(); } });
    $('#pNext').addEventListener('click', function () { if (S.page < totalPages) { S.page++; loadChars(); } });

    $$('.chr', box).forEach(function (row) {
      var h = row.dataset.h;
      $$('[data-act]', row).forEach(function (b) {
        b.addEventListener('click', function () { charAction(b.dataset.act, h); });
      });
    });
  }

  function charAction(act, hanzi) {
    if (act === 'know' || act === 'unknown') {
      api('POST', '/admin/chars', { hanzi: hanzi, known: act === 'know' }).then(function (res) {
        if (res.stats) { S.stats = res.stats; refreshStats(); }
        toast('「' + hanzi + '」已标为' + (act === 'know' ? '认识' : '不认识'));
        loadChars();
      }).catch(function (e) { toast('失败：' + e.message); });
    } else if (act === 'reset') {
      api('POST', '/admin/chars/reset', { hanzi: hanzi }).then(function (res) {
        if (res.stats) { S.stats = res.stats; refreshStats(); }
        toast('「' + hanzi + '」已重置为未测');
        loadChars();
      }).catch(function (e) { toast('失败：' + e.message); });
    } else if (act === 'del') {
      confirmBox({ title: '删除「' + hanzi + '」？', body: '将从字库中移除这个家长添加的字（内置字不能删）。', ok: '删除', danger: true }).then(function (y) {
        if (!y) return;
        api('DELETE', '/admin/chars/' + encodeURIComponent(hanzi)).then(function (res) {
          if (res.stats) { S.stats = res.stats; refreshStats(); }
          toast('已删除');
          loadChars();
        }).catch(function (e) { toast('失败：' + e.message); });
      });
    }
  }

  /* ---------------- 新增汉字（页面首位的独立模块，无预览卡片） ---------------- */
  function renderAdd() {
    var box = $('#addBox');
    box.innerHTML =
      '<div class="card">' +
        '<h2 style="font-size:16px;margin-bottom:14px">新增汉字</h2>' +
        '<div class="form-row">' +
          '<input class="input" id="hzInput" placeholder="在这里打一个汉字，例如：皓" ' +
            'style="text-align:center;font-family:var(--font-hanzi);font-size:46px;padding:14px">' +
        '</div>' +
        '<div class="tip">打进去后会自动查它的<b>拼音、笔画、部首和常用组词</b>；如果字库里已经有这个字，会显示它现在的状态。</div>' +
        '<div id="libInfo" class="tip" style="margin-top:12px"></div>' +
        '<div class="form-row" style="margin-top:18px">' +
          '<label>这个字孩子认识吗？</label>' +
          '<div class="state-picker">' +
            '<button class="state-opt on" data-st="known"><div class="t">认识</div><div class="d">进「我的字库」</div></button>' +
            '<button class="state-opt unk" data-st="unknown"><div class="t">不认识</div><div class="d">进练习库</div></button>' +
            '<button class="state-opt none" data-st="none"><div class="t">先不改状态</div><div class="d">只把字加进字库</div></button>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">' +
          '<button class="btn primary" id="saveBtn" disabled>保存</button>' +
          '<button class="btn ghost" id="clearBtn">清空</button>' +
        '</div>' +
      '</div>';

    var input = $('#hzInput');

    // 中文输入法兼容：拼字过程中（composition）不要动 value，
    // 否则会把「hao」这类拼音串当非法字符清掉，等于打断输入法，用户就「打不进字」。
    var composing = false;

    function normalize() {
      var v2 = (input.value || '').replace(/[^\u4e00-\u9fa5]/g, '').slice(0, 1);
      if (input.value !== v2) input.value = v2;
      if (v2) doLookup(v2); else resetAddInfo();
    }

    input.addEventListener('compositionstart', function () {
      composing = true;
      // 这个框只收一个汉字：开始输入新字时直接替换旧内容，
      // 否则新字的拼音会拼在旧字后面（如「花hao」），上屏后被当成第二个字丢掉。
      if (input.value) input.value = '';
    });
    input.addEventListener('compositionend', function () {
      composing = false;
      normalize();   // 拼字结束、汉字真正落下后再过滤和查询
    });
    input.addEventListener('input', function (e) {
      // 以事件自带的 isComposing 为准（最可靠）；composing 只作兜底，
      // 且收到非组合输入时主动复位，避免标志位残留导致后续输入被忽略。
      if (e.isComposing) return;
      composing = false;
      normalize();
    });
    input.addEventListener('focus', function () {
      // 聚焦即选中，直接打新字就会覆盖旧字
      setTimeout(function () { try { input.select(); } catch (e) { } }, 0);
    });
    $$('.state-opt').forEach(function (b) {
      b.addEventListener('click', function () {
        $$('.state-opt').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        S.lookupState = b.dataset.st;
      });
    });
    $('#saveBtn').addEventListener('click', saveChar);
    $('#clearBtn').addEventListener('click', function () { input.value = ''; resetAddInfo(); input.focus(); });
    // 模块常驻页面顶部，切标签页重渲染时不再抢焦点（只在首次进入时聚焦一次）
    if (!S.addFocused) {
      S.addFocused = true;
      setTimeout(function () { try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); } }, 100);
    }
  }

  function resetAddInfo() {
    $('#libInfo').innerHTML = '';
    $('#saveBtn').disabled = true;
    S.lookup = null;
  }

  var lookupSeq = 0;
  function doLookup(hz) {
    var seq = ++lookupSeq;   // 防止旧请求的响应盖掉新结果
    $('#saveBtn').disabled = true;
    $('#libInfo').innerHTML = '查询中…';
    api('GET', '/admin/lookup?hanzi=' + encodeURIComponent(hz)).then(function (res) {
      if (seq !== lookupSeq) return;
      S.lookup = res;
      var lines = [];
      var d = res.dict;
      if (d) {
        lines.push('拼音 <b>' + esc(d.pinyin || '') + '</b> · ' + (d.strokes || 0) + ' 画 · 部首 ' + esc(d.radical || '—') +
          '<br>组词：' + (d.words && d.words.length ? esc(d.words.join(' · ')) : '（暂无组词）'));
      } else {
        lines.push('字典里没找到这个字，保存会把字直接加进字库（拼音和组词可以留空）。');
      }
      if (res.inLibrary) {
        lines.push('字库里<b>已经有</b>这个字，当前状态：' + (res.status === 'known' ? '<b style="color:var(--know-deep)">认识</b>' : (res.status === 'unknown' ? '<b style="color:var(--unk-deep)">不认识</b>' : '未测')) + '。保存会更新它的状态。');
      } else {
        lines.push('字库里<b>还没有</b>这个字，保存会把它新增进来（来源标为「家长添加」）。');
      }
      $('#libInfo').innerHTML = lines.join('<br>');
      $('#saveBtn').disabled = false;
    }).catch(function (e) {
      $('#libInfo').innerHTML = '查询失败：' + esc(e.message);
    });
  }

  function saveChar() {
    var hz = ($('#hzInput').value || '').trim();
    if (!/^[\u4e00-\u9fa5]$/.test(hz)) { toast('请输入一个汉字'); return; }
    var payload = { hanzi: hz };
    if (S.lookupState === 'known') payload.known = true;
    else if (S.lookupState === 'unknown') payload.known = false;

    $('#saveBtn').disabled = true;
    api('POST', '/admin/chars', payload).then(function (res) {
      if (res.stats) { S.stats = res.stats; refreshStats(); }
      toast('「' + hz + '」' + (res.created ? '已新增到字库' : '状态已更新'));
      $('#hzInput').value = '';
      resetAddInfo();
      $('#hzInput').focus();
    }).catch(function (e) {
      $('#saveBtn').disabled = false;
      toast('保存失败：' + e.message);
    });
  }

  /* ---------------- 设置 ---------------- */
  function renderSettings() {
    var v = $('#view');
    v.innerHTML =
      '<div class="card">' +
        '<h2 style="font-size:16px;margin-bottom:12px">修改口令</h2>' +
        '<div class="form-row"><label>原口令</label><input class="input" id="pwOld" type="password" autocomplete="current-password"></div>' +
        '<div class="form-row"><label>新口令（至少 4 位）</label><input class="input" id="pwNew" type="password" autocomplete="new-password"></div>' +
        '<div class="form-row"><label>再输一次新口令</label><input class="input" id="pwNew2" type="password" autocomplete="new-password"></div>' +
        '<button class="btn primary" id="pwSave">保存新口令</button>' +
        '<div class="tip" style="margin-top:10px">改完口令后所有登录都会失效，需要重新登录。</div>' +
      '</div>' +

      '<div class="card">' +
        '<h2 style="font-size:16px;margin-bottom:12px">危险操作</h2>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          '<button class="btn danger" id="resetProg">清空全部学习进度</button>' +
          '<button class="btn danger" id="resetAll">清空进度 + 对局记录</button>' +
        '</div>' +
        '<div class="tip" style="margin-top:10px">只影响「哪些字认识 / 不认识」和成绩记录，<b>不会</b>删除字库里的字。</div>' +
      '</div>';

    $('#pwSave').addEventListener('click', function () {
      var o = $('#pwOld').value, n = $('#pwNew').value, n2 = $('#pwNew2').value;
      if (!o || !n) { toast('请填写原口令和新口令'); return; }
      if (n !== n2) { toast('两次输入的新口令不一致'); return; }
      if (n.length < 4) { toast('新口令至少 4 位'); return; }
      api('POST', '/admin/password', { oldPassword: o, newPassword: n }).then(function () {
        toast('口令已修改，请重新登录');
        setToken('');
        setTimeout(function () { renderLogin('口令已修改，请用新口令登录'); }, 700);
      }).catch(function (e) { toast('修改失败：' + e.message); });
    });

    function doReset(keepSessions, label) {
      confirmBox({
        title: '确定' + label + '？',
        body: '孩子端所有「认识 / 不认识」的记录会被清空，无法恢复（字库里的字保留）。',
        ok: '确定清空', danger: true
      }).then(function (y) {
        if (!y) return;
        api('POST', '/admin/reset', { keepSessions: keepSessions }).then(function (res) {
          if (res.stats) { S.stats = res.stats; refreshStats(); }
          toast('已清空');
          renderSettings();
        }).catch(function (e) { toast('失败：' + e.message); });
      });
    }
    $('#resetProg').addEventListener('click', function () { doReset(true, '清空学习进度'); });
    $('#resetAll').addEventListener('click', function () { doReset(false, '清空进度和对局记录'); });
  }

  /* ---------------- 工具 ---------------- */
  function debounce(fn, ms) {
    var t = null;
    return function () {
      var args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, args); }, ms);
    };
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    var lg = $('#login');
    lg.innerHTML = '';
    lg.classList.add('hidden');   // 容器有 min-height:100%，只清内容会占满一屏把主界面顶下去
    $('#app').classList.remove('hidden');
    S.tab = 'chars';
    api('GET', '/admin/stats').then(function (res) {
      S.stats = res.stats || {};
      S.parentChars = res.parentChars || 0;
      S.ready = true;
      renderTop();
      renderMain();
    }).catch(function (e) {
      // 令牌失效等 → login 里已经处理；其余给出提示
      renderTop();
      renderMain();
      toast('数据加载异常：' + e.message);
    });
  }

  if (token) boot(); else renderLogin();
})();

</script>
</body>
</html>
