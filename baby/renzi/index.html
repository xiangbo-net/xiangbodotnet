<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF9F0">
<title>汉字小侦探 · 认字闯关</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23F08C1E'/%3E%3Ctext x='32' y='45' font-size='40' text-anchor='middle' fill='%23fff' font-family='Kaiti SC,serif'%3E字%3C/text%3E%3C/svg%3E">
<style>
/* ===========================================================
   汉字小侦探 · 孩子端样式
   设计约束（沿用 v1 并强化）：
   · 4 岁儿童：汉字尽量大、点击目标大、无倒计时无失败感
   · 认识 = 暖橙（成就）；不认识 = 蓝灰（待解锁），刻意不用红色
   · 桌面 / 平板 / 手机 统一为「左滑=认识、右滑=不认识」一套手势
   · 滑动到位反馈：卡片染色 + 投放区光晕随位移连续变化，而不是突变的开关
   =========================================================== */

:root{
  --know:#F08C1E; --know-soft:#FFF1DC; --know-line:#F5B95C; --know-deep:#C67A11;
  --unk:#5E7185;  --unk-soft:#EDF2F7;  --unk-line:#9FB3C8;  --unk-deep:#455A6E;
  --ink:#2C2824; --ink-2:#6B625A; --ink-3:#9C928A;
  --bg-1:#FFF9F0; --bg-2:#F0F6FA;
  --panel:#FFFFFF; --line:rgba(44,40,36,.12);
  --r-sm:10px; --r-md:16px; --r-lg:24px; --r-xl:34px;
  --shadow:0 8px 30px rgba(80,60,30,.10);
  --shadow-card:0 16px 44px rgba(70,55,30,.16);
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-hanzi:"Kaiti SC","STKaiti","KaiTi","Kaiti TC","Baoli SC",serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);color:var(--ink);
  background:linear-gradient(165deg,var(--bg-1) 0%,var(--bg-2) 100%);
  background-attachment:fixed;
  overflow:hidden;user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button,.btn,.big-btn,.mode,.chip,.row{touch-action:manipulation}
h1,h2,h3,p{margin:0}

.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.hidden{display:none !important}

/* ---------------- 通用按钮 ---------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  padding:.85em 1.6em;border-radius:999px;font-size:17px;font-weight:600;
  background:#fff;border:1.5px solid var(--line);
  transition:transform .12s ease,box-shadow .18s ease,background .18s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(80,60,30,.10)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#FFB251,#F08C1E);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(240,140,30,.34)}
.btn.ghost{background:rgba(255,255,255,.7)}
.btn.lg{font-size:21px;padding:1em 2.4em}
.btn.sm{font-size:14px;padding:.55em 1.1em}
.btn.block{width:100%}

/* ===========================================================
   1. 首页
   =========================================================== */
#home{align-items:center;justify-content:center;padding:4vh 4vw;overflow:auto}
.home-wrap{width:min(880px,100%);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:16px;justify-content:center}
.brand-badge{
  width:66px;height:66px;border-radius:20px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(180deg,#FFC46B,#F08C1E);box-shadow:0 10px 24px rgba(240,140,30,.36);
}
.brand-badge span{font-family:var(--font-hanzi);font-size:40px;color:#fff;line-height:1;margin-top:4px}
.brand h1{font-size:32px;letter-spacing:.06em}
.brand p{font-size:14px;color:var(--ink-3);margin-top:4px}

.card{
  background:var(--panel);border-radius:var(--r-lg);padding:22px;
  box-shadow:var(--shadow);border:1px solid var(--line);
}
.card h2{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--know)}
.tip{font-size:13px;color:var(--ink-3);line-height:1.7}

/* 进度概览条 */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.stat .k{font-size:12px;color:var(--ink-3)}
.stat .v{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:2px}
.stat.know .v{color:var(--know-deep)}
.stat.unk  .v{color:var(--unk-deep)}

/* 主行动区 */
.main-actions{display:flex;flex-direction:column;gap:12px}
.action-card{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  background:#fff;border:2px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;
  transition:transform .14s ease,box-shadow .18s ease,border-color .18s ease;
}
.action-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(80,60,30,.13)}
.action-card:active{transform:scale(.99)}
.action-card .ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:0 0 auto}
.action-card .ico svg{width:30px;height:30px}
.action-card .tx{flex:1;min-width:0}
.action-card .tx .t{font-size:19px;font-weight:700}
.action-card .tx .d{font-size:13px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.action-card .go{font-size:22px;color:var(--ink-3);flex:0 0 auto}
.action-card.primary{border-color:var(--know-line);background:linear-gradient(180deg,#FFFBF5,#fff)}
.action-card.primary .ico{background:var(--know-soft)}
.action-card.practice .ico{background:var(--unk-soft)}
.action-card.library .ico{background:#EDF8F0}
.action-card.disabled{opacity:.5;pointer-events:none}
.action-card .badge{font-size:12px;background:var(--know-soft);color:#96590E;border-radius:999px;padding:3px 10px;font-weight:700;white-space:nowrap}
.action-card.practice .badge{background:var(--unk-soft);color:var(--unk-deep)}

.home-foot{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}

/* 模式选择 */
.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:2px solid var(--line);border-radius:var(--r-md);padding:15px;text-align:left;background:#fff;transition:.16s;position:relative}
.mode .t{font-size:15.5px;font-weight:600;margin-bottom:6px}
.mode .d{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.mode.on{border-color:var(--know);background:var(--know-soft)}
.mode.on::after{content:"已选";position:absolute;top:10px;right:12px;font-size:11px;color:#fff;background:var(--know);border-radius:999px;padding:2px 8px}

/* ===========================================================
   2. 认字页
   =========================================================== */
#play{padding:0}
.hud{
  flex:0 0 auto;display:flex;align-items:center;gap:18px;
  padding:12px 20px;background:rgba(255,255,255,.78);
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px);z-index:20;
}
.hud .prog-wrap{flex:1;max-width:420px}
.hud .prog-txt{font-size:12.5px;color:var(--ink-2);margin-bottom:5px;display:flex;justify-content:space-between;gap:10px}
.hud .prog-bar{height:8px;border-radius:999px;background:rgba(44,40,36,.09);overflow:hidden}
.hud .prog-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#FFC46B,#F08C1E);transition:width .38s cubic-bezier(.4,1.3,.5,1)}
.hud .counts{display:flex;gap:16px;font-size:14px;font-variant-numeric:tabular-nums}
.hud .counts b{font-weight:700}
.c-know{color:var(--know)} .c-unk{color:var(--unk)}
.hud .energy{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#B8791A}
.hud .mode-tag{font-size:12px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.icon-btn{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;
  border:1px solid var(--line);background:rgba(255,255,255,.92);
  transition:background .15s ease,transform .1s ease;
}
.icon-btn:hover{background:#fff}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:20px;height:20px}

/* 三栏主区：左投放区 / 卡片 / 右投放区 */
.board{
  flex:1;display:grid;grid-template-columns:1fr minmax(260px,1.6fr) 1fr;
  gap:14px;padding:14px 18px 6px;min-height:0;
}

/* 投放区：光晕强度由 --glow（0–1）连续驱动 */
.zone{
  position:relative;border-radius:var(--r-lg);overflow:hidden;
  border:2.5px dashed var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:border-color .18s ease;
  --glow:0;
}
.zone .z-glow{
  position:absolute;inset:0;opacity:var(--glow);
  background:radial-gradient(circle at 50% 50%,var(--g1),transparent 72%);
  transition:opacity .12s linear;
}
.zone .z-body{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;
  transform:scale(calc(1 + var(--glow) * .07));transition:transform .14s ease}
.zone .z-icon{width:54px;height:54px;display:flex;align-items:center;justify-content:center}
.zone .z-icon svg{width:100%;height:100%;display:block}
.zone .z-title{font-size:22px;font-weight:700;letter-spacing:.05em}
.zone .z-hint{font-size:12.5px;color:var(--ink-3)}
.zone .z-count{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:2px}

#zoneKnow{border-color:var(--know-line);background:linear-gradient(180deg,rgba(255,241,220,.5),rgba(255,255,255,.3))}
#zoneKnow .z-glow{--g1:rgba(240,140,30,.5)}
#zoneKnow .z-title{color:#B4720F}
#zoneKnow.active{border-color:var(--know);border-style:solid;box-shadow:0 0 0 3px rgba(240,140,30,.16)}

#zoneUnk{border-color:var(--unk-line);background:linear-gradient(180deg,rgba(237,242,247,.7),rgba(255,255,255,.3))}
#zoneUnk .z-glow{--g1:rgba(94,113,133,.42)}
#zoneUnk .z-title{color:#42566A}
#zoneUnk.active{border-color:var(--unk);border-style:solid;box-shadow:0 0 0 3px rgba(94,113,133,.16)}

/* 落位闪光 */
.zone.flash-know{animation:flashKnow .5s ease}
.zone.flash-unk{animation:flashUnk .5s ease}
@keyframes flashKnow{0%{background:#FFE3B8;transform:scale(1.03)}100%{background:linear-gradient(180deg,rgba(255,241,220,.5),rgba(255,255,255,.3));transform:none}}
@keyframes flashUnk{0%{background:#D8E3EE;transform:scale(1.03)}100%{background:linear-gradient(180deg,rgba(237,242,247,.7),rgba(255,255,255,.3));transform:none}}

/* ---------------- 字卡 ---------------- */
.card-stage{position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
.hanzi-card{
  position:relative;width:100%;height:100%;max-width:520px;max-height:100%;
  background:var(--panel);border-radius:var(--r-xl);box-shadow:var(--shadow-card);
  border:1px solid var(--line);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:34px 24px 24px;gap:2px;
  cursor:grab;touch-action:none;
  will-change:transform;
  transition:transform .34s cubic-bezier(.34,1.4,.5,1),opacity .3s ease;
  --dragp:0;
}
.hanzi-card:active{cursor:grabbing}
/* 拖动染色：随位移把卡片整体推向对应色 */
.hanzi-card::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--dragp);transition:opacity .1s linear;
}
.hanzi-card.to-know::before{background:linear-gradient(90deg,rgba(240,140,30,.20),rgba(240,140,30,.03));box-shadow:inset 0 0 0 4px rgba(240,140,30,.5)}
.hanzi-card.to-unk::before{background:linear-gradient(270deg,rgba(94,113,133,.18),rgba(94,113,133,.03));box-shadow:inset 0 0 0 4px rgba(94,113,133,.45)}
/* 拖动水印（认识 / 不认识），随位移淡入 */
.hanzi-card .stamp{
  position:absolute;top:26%;font-size:clamp(24px,4.6vh,44px);font-weight:800;letter-spacing:.14em;
  border:4px solid;border-radius:14px;padding:6px 16px;opacity:0;pointer-events:none;
  transform:rotate(-8deg) scale(.9);transition:opacity .1s linear,transform .14s ease;
}
.hanzi-card .stamp.know{left:8%;color:var(--know);border-color:var(--know);transform:rotate(-10deg)}
.hanzi-card .stamp.unk{right:8%;color:var(--unk);border-color:var(--unk);transform:rotate(10deg)}
.hanzi-card.to-know .stamp.know,.hanzi-card.to-unk .stamp.unk{opacity:var(--dragp);transform:rotate(-10deg) scale(1)}
.hanzi-card.to-unk .stamp.unk{transform:rotate(10deg) scale(1)}

.hanzi-card .glyph{
  font-family:var(--font-hanzi);
  font-size:clamp(104px,27vh,250px);line-height:1.04;letter-spacing:.02em;color:#26221E;
  text-shadow:0 2px 0 rgba(0,0,0,.03);position:relative;
}
.hanzi-card .py-line{
  position:relative;display:flex;align-items:center;gap:10px;min-height:36px;margin-top:2px;
}
.hanzi-card .pinyin{
  font-size:26px;color:var(--unk);letter-spacing:.06em;font-weight:600;font-variant-numeric:tabular-nums;
  opacity:0;transform:translateY(6px);transition:.22s;
}
.hanzi-card .pinyin.show{opacity:1;transform:none}
.hanzi-card .reveal{
  border:1.5px solid var(--line);border-radius:999px;padding:.4em 1.1em;font-size:13.5px;color:var(--ink-2);background:#fff;
  position:relative;
}
.hanzi-card .reveal:hover{background:var(--unk-soft)}
/* 组词区：3–5 个最常用词组，纵向紧凑排布 */
.hanzi-card .words{
  position:relative;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  max-width:92%;margin-top:6px;
  opacity:0;max-height:0;transform:translateY(8px);overflow:hidden;
  transition:opacity .24s ease,transform .24s ease,max-height .3s ease,margin .24s ease;
}
.hanzi-card .words.show{opacity:1;max-height:150px;transform:none}
.hanzi-card .words .wd{
  font-size:15px;color:#5A5148;background:#F7F3ED;border:1px solid rgba(44,40,36,.08);
  border-radius:999px;padding:5px 12px;letter-spacing:.04em;
}
.hanzi-card .speak{
  position:absolute;top:14px;right:14px;width:46px;height:46px;border-radius:50%;z-index:2;
  display:grid;place-items:center;background:var(--know-soft);border:1px solid var(--know-line);
}
.hanzi-card .speak svg{width:22px;height:22px}
.hanzi-card .speak:hover{background:#FFE6C2}
.hanzi-card .dwell{position:absolute;left:18px;bottom:12px;font-size:11.5px;color:var(--ink-3);opacity:.7}
.hanzi-card.dragging{transition:none !important;cursor:grabbing;box-shadow:0 26px 60px rgba(70,55,30,.22)}
.hanzi-card.enter{animation:cardIn .36s cubic-bezier(.34,1.4,.5,1)}
@keyframes cardIn{from{transform:translateY(22px) scale(.95);opacity:0}to{transform:none;opacity:1}}

/* 练习模式：左下角回看提示 */
.practice-note{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  font-size:12px;color:var(--ink-3);background:rgba(255,255,255,.75);
  border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap;
}

/* 底部兜底按钮 */
.actions{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;padding:8px 18px 16px}
.big-btn{
  display:flex;align-items:center;gap:12px;padding:15px 34px;border-radius:999px;font-size:19px;font-weight:700;
  border:2px solid transparent;transition:transform .12s ease,box-shadow .18s ease;
}
.big-btn:active{transform:scale(.96)}
.big-btn.know{background:linear-gradient(180deg,#FFC46B,#F08C1E);color:#fff;box-shadow:0 10px 24px rgba(240,140,30,.32)}
.big-btn.unk{background:linear-gradient(180deg,#8496A8,#5E7185);color:#fff;box-shadow:0 10px 24px rgba(94,113,133,.28)}
.big-btn svg{width:26px;height:26px;flex:0 0 auto}

/* 飘字 / 连击 / 升级 */
.toast-layer{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.float{
  position:absolute;font-weight:700;font-size:24px;color:#E1851A;
  animation:floatUp 1s cubic-bezier(.2,1,.4,1) forwards;text-shadow:0 2px 8px rgba(255,255,255,.85);
}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px) scale(.8)}25%{opacity:1;transform:translateY(-10px) scale(1.06)}100%{opacity:0;transform:translateY(-70px) scale(1)}}
.levelup{position:fixed;inset:0;display:grid;place-items:center;z-index:70;pointer-events:none}
.levelup .inner{
  background:rgba(255,255,255,.96);border-radius:var(--r-xl);padding:32px 48px;text-align:center;
  box-shadow:0 30px 70px rgba(70,55,30,.28);border:2px solid var(--know-line);
  animation:popIn .5s cubic-bezier(.3,1.5,.5,1);
}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.levelup .medal{width:80px;height:80px;margin:0 auto 10px}
.levelup .t1{font-size:14px;color:var(--ink-3)}
.levelup .t2{font-size:30px;font-weight:800;color:#B4720F;margin-top:4px;letter-spacing:.06em}

/* ===========================================================
   3. 结算页
   =========================================================== */
#result{overflow-y:auto;display:none}
#result.on{display:block}
.res-wrap{width:min(1000px,100%);margin:0 auto;padding:24px 20px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.res-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.res-head h1{font-size:25px}
.res-head .sub{font-size:13.5px;color:var(--ink-3);margin-top:4px}
.stars{display:flex;gap:6px;margin-left:auto}
.stars svg{width:36px;height:36px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:15px 17px;box-shadow:0 4px 16px rgba(80,60,30,.05)}
.metric .k{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.metric .v{font-size:30px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.metric .v small{font-size:14px;font-weight:600;color:var(--ink-3);margin-left:3px}
.metric.know{border-color:var(--know-line);background:linear-gradient(180deg,#FFFAF2,#fff)}
.metric.know .v{color:var(--know-deep)}
.metric.unk{border-color:var(--unk-line)}
.metric.unk .v{color:var(--unk-deep)}
.metric.new .v{color:#3E8F4E}
.res-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.list-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.list-head h3{font-size:15px}
.list-head .n{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.char-chips{display:flex;flex-wrap:wrap;gap:8px;max-height:300px;overflow:auto}
.chip{min-width:54px;padding:8px 10px 6px;border-radius:var(--r-sm);text-align:center;border:1.5px solid var(--line);background:#fff}
.chip .c{font-family:var(--font-hanzi);font-size:31px;line-height:1.05}
.chip .p{font-size:11px;color:var(--ink-3);margin-top:3px}
.chip.know{border-color:var(--know-line);background:var(--know-soft)}
.chip.unk{border-color:var(--unk-line);background:var(--unk-soft)}
.chip.new{border-color:#8CC79A;background:#EDF8F0}
.empty-tip{font-size:13px;color:var(--ink-3);padding:8px 2px}
.res-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:4px}

/* ===========================================================
   4. 字库（已认识的字）
   =========================================================== */
#library{overflow-y:auto;display:none;padding:0}
#library.on{display:block}
.lib-wrap{width:min(1000px,100%);margin:0 auto;padding:20px 20px calc(40px + env(safe-area-inset-bottom))}
.lib-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.lib-top h1{font-size:23px}
.lib-top .sub{font-size:13px;color:var(--ink-3)}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.lib-card{

  function el(tag, cls, html) { var d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]; }); }
  function show(id) { ['home', 'play', 'result', 'library'].forEach(function (s) { var n = $('#' + s); if (n) n.classList.toggle('on', s === id); }); document.body.dataset.screen = id; }
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { } }

  var TITLES = [
    { e: 0, n: '新手上路' }, { e: 100, n: '汉字小侦探' }, { e: 300, n: '识字小能手' },
    { e: 600, n: '识字小达人' }, { e: 1000, n: '汉字小博士' }, { e: 2000, n: '汉字大师' }
  ];
  function titleOf(e) { var t = TITLES[0].n; TITLES.forEach(function (x) { if (e >= x.e) t = x.n; }); return t; }
  function titleRank(e) { var r = 0; TITLES.forEach(function (x) { if (e >= x.e) r = x.e; }); return r; }

  function floatText(x, y, text, color) {
    var layer = $('#toasts'); if (!layer) return;
    var d = el('div', 'float', esc(text));
    d.style.left = x + 'px'; d.style.top = y + 'px';
    if (color) d.style.color = color;
    layer.appendChild(d);
    setTimeout(function () { d.remove(); }, 1050);
  }

  /* ---------------- 自定义确认弹层（替代原生 confirm） ---------------- */
  function confirmBox(opt) {
    return new Promise(function (resolve) {
      var ov = el('div', 'overlay');
      ov.innerHTML = '<div class="box"><h2>' + esc(opt.title || '提示') + '</h2>' +
        '<p>' + (opt.body || '') + '</p>' +
        '<div class="foot">' +
        '<button class="btn ghost" data-x="0">' + esc(opt.cancel || '取消') + '</button>' +
        '<button class="btn primary" data-x="1">' + esc(opt.ok || '确定') + '</button>' +
        '</div></div>';
      document.body.appendChild(ov);
      function done(v) { ov.remove(); resolve(v); }
      ov.addEventListener('click', function (e) {
        var b = e.target.closest('[data-x]');
        if (b) done(b.dataset.x === '1');
        else if (e.target === ov) done(false);
      });
    });
  }

  /* ---------------- 全局状态 ---------------- */
  var S = {
    loaded: false,
    chars: [],       // 按难度升序：[{c,p,s,d,w,src}]
    byChar: {},
    progress: {},    // { c: {st:'known'|'unknown', k, u, t} }
    sessions: [],
    stats: {},
    config: { perLevel: 20, perPractice: 10 },
    round: null
  };

  function untested() { return S.chars.filter(function (x) { return !S.progress[x.c]; }); }
  function knownList() { return S.chars.filter(function (x) { var p = S.progress[x.c]; return p && p.st === 'known'; }); }
  function unknownList() { return S.chars.filter(function (x) { var p = S.progress[x.c]; return p && p.st === 'unknown'; }); }

  function recalcStats() {
    var total = S.chars.length, known = 0, unknown = 0;
    Object.keys(S.progress).forEach(function (c) { var p = S.progress[c]; if (p.st === 'known') known++; else if (p.st === 'unknown') unknown++; });
    var tested = known + unknown;
    var per = S.config.perLevel || 20;
    S.stats = {
      total: total, known: known, unknown: unknown, tested: tested,
      untested: Math.max(0, total - tested),
      levelNo: Math.floor(tested / per) + 1,
      totalLevels: Math.max(1, Math.ceil(total / per)),
      practiceGroups: Math.max(0, Math.ceil(unknown / (S.config.perPractice || 10)))
    };
  }

  /* ---------------- 网络 ---------------- */
  function apiGet(path) {
    return fetch(API_BASE + path, { headers: { 'Accept': 'application/json' } }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || j.ok === false) { var e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
  }
  function apiPost(path, body) {
    return fetch(API_BASE + path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {})
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || j.ok === false) { var e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
  }

  // 待同步队列：整局提交失败时落本地，下次启动补传
  function queuePending(payload) { var q = lsGet('pending', []) || []; q.push(payload); if (q.length > 30) q = q.slice(-30); lsSet('pending', q); }
  function flushPending() {
    var q = lsGet('pending', []) || [];
    if (!q.length) return Promise.resolve();
    lsSet('pending', []);
    return Promise.all(q.map(function (p) {
      return apiPost('/round', p).catch(function (e) { if (e.status >= 400 && e.status < 500) return null; queuePending(p); return null; });
    }));
  }

  /* ===========================================================

    var practiceCard = '<button class="action-card practice' + (un.length ? '' : ' disabled') + '" data-go="practice">' +
      '<div class="ico">' + svg('dumbbell', 30, '#455A6E') + '</div>' +

      '<div class="tx"><div class="t">我的字库</div>' +
      '<div class="d">已经认识 ' + kn.length + ' 个字，随时点开复习（带拼音和组词）</div></div>' +
      '<div class="go">›</div></button>';

    var modeCards = [
      { k: 'self', t: '孩子自己滑', d: '认识往左滑，不认识往右滑。家长在旁边陪着就行。' },
      { k: 'parent', t: '家长判读（更准）', d: '让孩子读出来，家长点「读对了 / 没读对」。结果更可信。' }
    ].map(function (m) {
      return '<button class="mode ' + (settings.mode === m.k ? 'on' : '') + '" data-mode="' + m.k + '">' +
        '<div class="t">' + m.t + '</div><div class="d">' + m.d + '</div></button>';
    }).join('');

    wrap.innerHTML =
      '<div class="home-wrap">' +
        '<div class="brand">' +
          '<div class="brand-badge"><span>字</span></div>' +
          '<div><h1>汉字小侦探</h1><p>看看我认识多少个字 · 一共 ' + st.total + ' 个字，按难度一关一关来</p></div>' +
        '</div>' +

        '<div class="stat-strip">' +
          '<div class="stat know"><div class="k">已经认识</div><div class="v">' + st.known + '<small>字</small></div></div>' +
          '<div class="stat unk"><div class="k">要练习的</div><div class="v">' + st.unknown + '<small>字</small></div></div>' +
          '<div class="stat"><div class="k">还没测过</div><div class="v">' + st.untested + '<small>字</small></div></div>' +
          '<div class="stat"><div class="k">进度</div><div class="v">' + st.levelNo + '/' + st.totalLevels + '<small>关</small></div></div>' +
        '</div>' +

        '<div class="main-actions">' +
          levelCard + practiceCard + libCard +

        '</div>' +

        '<div class="home-foot">' +
          '<button class="btn ghost" id="gearBtn" title="家长设置（长按 2 秒）">' + svg('gear', 18) + '家长设置</button>' +
          '<button class="btn ghost" id="guideBtn">怎么玩</button>' +

    wrap.querySelectorAll('[data-go]').forEach(function (b) {
      b.addEventListener('click', function () {
        Sfx.unlock();
        var g = b.dataset.go;
        if (g === 'level') ensureGuide(function () { startLevelRound(); });
        else if (g === 'practice') startPracticeRound();
        else if (g === 'library') renderLibrary();
      });
    });
    wrap.querySelectorAll('[data-mode]').forEach(function (b) {
      b.addEventListener('click', function () { settings.mode = b.dataset.mode; saveSettings(); Sfx.tap(); renderHome(); });

    $('#guideBtn').addEventListener('click', function () { showGuide(); });
    bindGear($('#gearBtn'), true);

  function bindGear(btn, allowClick) {
    if (!btn) return;
    var t = null, ring = null;
    function clear() { if (t) { clearTimeout(t); t = null; } if (ring) { ring.remove(); ring = null; } }
    function down(e) {
      e.preventDefault();
      var r = btn.getBoundingClientRect();
      ring = el('div', 'hold-ring on', '<svg width="60" height="60"><circle cx="30" cy="30" r="24" stroke-dasharray="151" stroke-dashoffset="151"></circle></svg>');
      ring.style.left = (r.left + r.width / 2 - 30) + 'px';
      ring.style.top = (r.top + r.height / 2 - 30) + 'px';
      document.body.appendChild(ring);
      var c = ring.querySelector('circle');
      c.style.transition = 'stroke-dashoffset 2s linear';
      requestAnimationFrame(function () { c.style.strokeDashoffset = '0'; });
      t = setTimeout(function () { clear(); openSheet(); }, 2000);
    }
    btn.addEventListener('pointerdown', down);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { btn.addEventListener(ev, clear); });
    if (allowClick) btn.addEventListener('click', function () { clear(); openSheet(); });
  }

  /* ---------------- 玩法说明 ----------------
     首次进入会自动弹一次；右上角 ✕、点遮罩、按 Esc 都能关掉。
     「我知道啦」= 关掉并继续待办动作；✕ / 遮罩 = 只关掉，不继续。 */
  function showGuide(then) {
    var ov = el('div', 'overlay');
    ov.innerHTML = '<div class="box">' +
      '<button class="x" id="gClose" aria-label="关闭" title="关闭">' + svg('close', 18) + '</button>' +
      '<h2>怎么玩？</h2>' +
      '<div class="demo">' +
        '<div class="mini" style="border-color:' + '#F5B95C' + ';background:#FFF1DC;color:#B4720F;font-size:20px;font-weight:800">认识</div>' +
        '<div class="arw">←</div><div class="mini">木</div><div class="arw">→</div>' +
        '<div class="mini" style="border-color:#9FB3C8;background:#EDF2F7;color:#42566A;font-size:20px;font-weight:800">不认识</div>' +
      '</div>' +
      '<p>中间会蹦出一个大字，<b>认识就往左滑</b>，<b>不认识就往右滑</b>。<br>' +
      '滑不动也没关系——下面两个大按钮点一下就行。<br>' +
      '点卡片右上角的小喇叭可以听这个字怎么读；点「看拼音」会显示拼音和组词。</p>' +
      '<div class="foot"><button class="btn primary" id="gOk">我知道啦</button></div>' +
      '</div>';
    document.body.appendChild(ov);

    function done(go) {
      document.removeEventListener('keydown', onKey);
      ov.remove();
      settings.seenGuide = true; saveSettings();   // 关掉就不再自动弹（首页「怎么玩」可随时再看）
      if (go && then) then();
    }
    function onKey(e) { if (e.key === 'Escape') done(false); }

    ov.querySelector('#gOk').addEventListener('click', function () { done(true); });
    ov.querySelector('#gClose').addEventListener('click', function () { done(false); });
    ov.addEventListener('click', function (e) { if (e.target === ov) done(false); });
    document.addEventListener('keydown', onKey);
  }
  function ensureGuide(fn) { if (settings.seenGuide) fn(); else showGuide(fn); }

  /* ===========================================================
     认字页
     =========================================================== */

  // 关卡：从「还没测过的字」里按难度取前 N 个
  function currentLevelChars() {
    var per = S.config.perLevel || 20;
    return untested().slice(0, per);
  }
  // 练习：从「不认识的池子」里取 N 个，错得多的、最近错的优先
  function currentPracticeChars() {
    var per = S.config.perPractice || 10;
    var list = unknownList().slice();
    list.sort(function (a, b) {
      var pa = S.progress[a.c] || { u: 0, t: 0 }, pb = S.progress[b.c] || { u: 0, t: 0 };
      return (pb.u - pa.u) || (pb.t - pa.t);
    });
    return list.slice(0, per);
  }

  function startLevelRound() {
    var chars = currentLevelChars();
    if (!chars.length) { alertBox('太棒了，所有字都测完啦！'); return; }
    beginRound('level', chars);
  }
  function startPracticeRound() {
    var chars = currentPracticeChars();
    if (!chars.length) { alertBox('现在没有需要练习的字。'); return; }
    beginRound('practice', chars);
  }
  function alertBox(msg) {
    var ov = el('div', 'overlay');
    ov.innerHTML = '<div class="box"><p>' + esc(msg) + '</p><div class="foot"><button class="btn primary" data-x="1">好</button></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function (e) { if (e.target.closest('[data-x]')) ov.remove(); });
  }

  function beginRound(kind, chars) {
    S.round = {
      kind: kind,
      levelNo: kind === 'level' ? (S.stats.levelNo || 1) : 0,
      chars: chars.map(function (x) { return x.c; }),
      idx: 0,
      marks: {},
      mode: settings.mode,
      startedAt: Date.now(),
      cardShownAt: 0,
      dwells: [],
      combo: 0, maxCombo: 0,
      tooFast: 0,
      energyGain: 0,
      locked: false,
      saved: false
    };
    show('play');
    paintPlay();
    renderCard(true);
  }

  function paintPlay() {
    var r = S.round;
    var isPractice = r.kind === 'practice';
    var modeTag = (isPractice ? '练习模式 · ' : '') + (r.mode === 'parent' ? '家长判读' : '孩子自己滑');
    var n = r.chars.length;

    $('#play').innerHTML =
      '<div class="hud">' +
        '<button class="icon-btn" id="quitBtn" title="退出这一局" aria-label="退出">' + svg('arrowL', 20) + '</button>' +
        '<div class="prog-wrap">' +
          '<div class="prog-txt"><span id="pgTxt">第 1 / ' + n + ' 张</span><span id="pgLeft">' +
            (isPractice ? '练一练不认得的字' : ('第 ' + r.levelNo + ' 关 · 还剩 ' + n + ' 张')) + '</span></div>' +
          '<div class="prog-bar"><div class="prog-fill" id="pgFill"></div></div>' +
        '</div>' +
        '<div class="counts">' +
          '<span class="c-know">认识 <b id="nKnow">0</b></span>' +
          '<span class="c-unk">不认识 <b id="nUnk">0</b></span>' +
        '</div>' +
        '<div class="energy">' + svg('bolt', 16, '#E1A02A') + '<span id="nEnergy">' + energy + '</span></div>' +
        '<span class="mode-tag">' + esc(modeTag) + '</span>' +
      '</div>' +

      '<div class="board">' +
        '<div class="zone" id="zoneKnow">' +
          '<div class="z-glow"></div>' +
          '<div class="z-body">' +
            '<div class="z-icon">' + svg('smile', 54, '#F08C1E') + '</div>' +
            '<div class="z-title">认识</div>' +
            '<div class="z-hint">往左滑到这里</div>' +
            '<div class="z-count" id="zkCount">0 个</div>' +
          '</div>' +
        '</div>' +
        '<div class="card-stage" id="stage"></div>' +
        '<div class="zone" id="zoneUnk">' +
          '<div class="z-glow"></div>' +
          '<div class="z-body">' +
            '<div class="z-icon">' + svg('ask', 54, '#5E7185') + '</div>' +
            '<div class="z-title">不认识</div>' +
            '<div class="z-hint">往右滑到这里</div>' +
            '<div class="z-count" id="zuCount">0 个</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="actions">' +
        '<button class="big-btn know" id="btnKnow">' + svg('check', 26) + '<span>' + (r.mode === 'parent' ? '读对了' : '我认识') + '</span></button>' +
        '<button class="big-btn unk" id="btnUnk">' + svg('ring', 26) + '<span>' + (r.mode === 'parent' ? '没读对' : '还不认识') + '</span></button>' +
      '</div>' +
      '<div class="toast-layer" id="toasts"></div>';

    // ★ 返回按钮修复：用 pointerup 直接响应 + 自定义确认弹层，不再依赖原生 confirm()
    var quit = $('#quitBtn');
    quit.addEventListener('click', onQuit);
    quit.addEventListener('pointerup', function (e) { e.stopPropagation(); });

    $('#btnKnow').addEventListener('click', function () { answer('know'); });
    $('#btnUnk').addEventListener('click', function () { answer('unk'); });
    updateHud();
  }

  function onQuit(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!S.round) { show('home'); renderHome(); return; }
    var done = Object.keys(S.round.marks).length;
    confirmBox({
      title: '先退出这一局吗？',
      body: done
        ? '已经答了 <b>' + done + '</b> 张，进度会自动保存，下次接着来。'
        : '这一局还没开始答，退出不会丢东西。',
      ok: '退出', cancel: '继续玩'
    }).then(function (yes) {
      if (!yes) return;
      if (done) submitCurrentRound(true);
      S.round = null;
      clearInterval(S._dwellTimer);
      show('home'); renderHome();
    });
  }

  function updateHud() {
    var r = S.round; if (!r) return;
    var n = r.chars.length, i = r.idx;
    var know = 0, unk = 0;
    Object.keys(r.marks).forEach(function (c) { if (r.marks[c] === 'known') know++; else unk++; });
    var f = $('#pgFill'); if (f) f.style.width = (i / n * 100) + '%';
    var gt = $('#pgTxt'); if (gt) gt.textContent = '第 ' + Math.min(i + 1, n) + ' / ' + n + ' 张';
    var gl = $('#pgLeft');
    if (gl) gl.textContent = r.kind === 'practice' ? '练一练不认得的字' : ('第 ' + r.levelNo + ' 关 · 还剩 ' + Math.max(0, n - i) + ' 张');
    var nk = $('#nKnow'); if (nk) nk.textContent = know;
    var nu = $('#nUnk'); if (nu) nu.textContent = unk;
    var ne = $('#nEnergy'); if (ne) ne.textContent = energy;
    var zk = $('#zkCount'); if (zk) zk.textContent = know + ' 个';
    var zu = $('#zuCount'); if (zu) zu.textContent = unk + ' 个';
  }

  /* ---------------- 渲染一张卡 ---------------- */
  function renderCard(first) {
    var r = S.round; if (!r) return;
    var stage = $('#stage'); if (!stage) return;
    cleanupDrag();
    if (r.idx >= r.chars.length) { finishRound(); return; }

    var c = r.chars[r.idx];
    var info = S.byChar[c] || { c: c, p: '', w: [], s: 0 };
    var isPractice = r.kind === 'practice';
    // 练习模式默认展示拼音与组词；关卡测试时默认收起（避免看拼音蒙对）
    var revealOn = isPractice || settings.showPinyin;

    stage.innerHTML =
      '<div class="hanzi-card enter" id="card">' +
        '<div class="stamp know">认识</div>' +
        '<div class="stamp unk">不认识</div>' +
        '<button class="speak" id="speakBtn" title="听读音">' + svg('speaker', 22, '#B4720F') + '</button>' +
        '<div class="glyph">' + esc(c) + '</div>' +
        '<div class="py-line">' +
          '<span class="pinyin ' + (revealOn ? 'show' : '') + '" id="py">' + esc(info.p || '') + '</span>' +
        '</div>' +
        '<div class="words ' + (revealOn ? 'show' : '') + '" id="words">' +
          (info.w && info.w.length
            ? info.w.map(function (w) { return '<span class="wd">' + esc(w) + '</span>'; }).join('')
            : '<span class="wd" style="opacity:.6">（这个字暂时没有组词）</span>') +
        '</div>' +
        '<div class="py-line">' +
          '<button class="reveal" id="revealBtn">' + (revealOn ? '收起拼音和组词' : '看拼音和组词') + '</button>' +
        '</div>' +
        '<div class="dwell" id="dwellTxt"></div>' +
      '</div>' +
      (isPractice ? '<div class="practice-note">练会了就点「我认识」，它就会进「我的字库」</div>' : '');

    var card = $('#card');
    r.cardShownAt = performance.now();
    r.locked = false;
    r.drag = null;

    $('#speakBtn').addEventListener('click', function (e) { e.stopPropagation(); Talk.say(c); Sfx.tap(); });
    $('#revealBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      var on = $('#words').classList.toggle('show');
      $('#py').classList.toggle('show', on);
      e.target.textContent = on ? '收起拼音和组词' : '看拼音和组词';
    });

    bindDrag(card);

    clearInterval(S._dwellTimer);
    S._dwellTimer = setInterval(function () {
      var d = $('#dwellTxt');
      if (!d || !S.round || S.round.locked) return;
      var sec = (performance.now() - S.round.cardShownAt) / 1000;
      d.textContent = sec.toFixed(1) + ' 秒';
      d.style.opacity = sec > 8 ? '0.4' : '0.7';
    }, 200);
  }

  /* ---------------- 拖拽（window 级监听，避免 setPointerCapture 吞事件） ---------------- */
  // 每次换卡都先清掉上一张卡残留的 window 级监听，避免监听器累积导致重复判定
  function cleanupDrag() { if (S._dragCleanup) { S._dragCleanup(); S._dragCleanup = null; } }

  function bindDrag(card) {
    var r = S.round;
    cleanupDrag();

    function onDown(e) {
      if (!r || r.locked) return;
      if (e.target.closest('.speak') || e.target.closest('.reveal')) return;
      r.drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0 };
      card.classList.add('dragging');
      card.style.transition = 'none';
      Sfx.pick();
    }
    function onMove(e) {
      if (!r.drag || e.pointerId !== r.drag.id) return;
      r.drag.dx = e.clientX - r.drag.x0;
      r.drag.dy = e.clientY - r.drag.y0;
      applyDrag(card, r.drag.dx, r.drag.dy);
      if (e.cancelable) e.preventDefault();
    }
    function onUp(e) {
      if (!r.drag || e.pointerId !== r.drag.id) return;
      var dx = r.drag.dx, dy = r.drag.dy;
      r.drag = null;
      cleanup();
      card.classList.remove('dragging');
      var w = card.offsetWidth || 300;
      var side = null;
      if (dx < -w * 0.28) side = 'know';
      else if (dx > w * 0.28) side = 'unk';
      if (!side) {
        resetCard(card);
        setZoneGlow(null, 0);
        // 上面 cleanup() 已经摘掉了这张卡的全部拖拽监听。
        // 这里是「拖了但没到位、松手弹回」的分支，必须重新绑定，
        // 否则这张卡从此再也拖不动（只能用底部按钮），直到换下一张卡。
        bindDrag(card);
        return;
      }
      flyOut(card, side, dy, function () { answer(side, true); });
    }
    function cleanup() {
      card.removeEventListener('pointerdown', onDown);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      if (S._dragCleanup === cleanup) S._dragCleanup = null;
    }
    S._dragCleanup = cleanup;

    card.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }

  function applyDrag(card, dx, dy) {
    var rot = Math.max(-14, Math.min(14, dx / 18));
    card.style.transform = 'translate3d(' + dx + 'px,' + (dy * 0.28) + 'px,0) rotate(' + rot + 'deg)';
    var w = card.offsetWidth || 300;
    var p = Math.min(1, Math.abs(dx) / (w * 0.5));
    card.style.setProperty('--dragp', p.toFixed(3));
    if (dx < -6) { card.classList.add('to-know'); card.classList.remove('to-unk'); setZoneGlow('know', p); }
    else if (dx > 6) { card.classList.add('to-unk'); card.classList.remove('to-know'); setZoneGlow('unk', p); }
    else { card.classList.remove('to-know', 'to-unk'); setZoneGlow(null, 0); }
  }

  function setZoneGlow(side, p) {
    var zk = $('#zoneKnow'), zu = $('#zoneUnk');
    if (!zk || !zu) return;
    zk.style.setProperty('--glow', side === 'know' ? p.toFixed(3) : 0);
    zu.style.setProperty('--glow', side === 'unk' ? p.toFixed(3) : 0);
    zk.classList.toggle('active', side === 'know' && p > 0.14);
    zu.classList.toggle('active', side === 'unk' && p > 0.14);
  }

  function resetCard(card) {
    card.classList.remove('to-know', 'to-unk');
    card.style.setProperty('--dragp', 0);
    card.style.transition = 'transform .3s cubic-bezier(.34,1.4,.5,1)';
    card.style.transform = '';
  }

  function flyOut(card, side, dy, done) {
    var dir = side === 'know' ? -1 : 1;
    var x = dir * (window.innerWidth * 0.95);
    var rot = dir * 15;
    card.style.transition = 'transform .32s cubic-bezier(.3,.85,.4,1), opacity .32s ease';
    card.style.transform = 'translate3d(' + x + 'px,' + ((dy || 0) * 0.25 + 20) + 'px,0) rotate(' + rot + 'deg)';
    card.style.opacity = '.12';
    var zone = side === 'know' ? $('#zoneKnow') : $('#zoneUnk');
    if (zone) {
      zone.classList.add(side === 'know' ? 'flash-know' : 'flash-unk');
      setTimeout(function () { zone.classList.remove('flash-know', 'flash-unk'); }, 520);
    }
    setTimeout(function () { if (done) done(); }, 240);
  }

  /* ---------------- 作答 ----------------
     side: 'know' | 'unk'
     fromSwipe: true 表示这次是手势滑出来的（卡片在 onUp 里已经飞出去了），
                此时不要再补一次飞出动画；按钮 / 键盘通道传 false，
                由这里调用同一个 flyOut()，让卡片按相同方向、相同动画飞出去。 */
  function answer(side, fromSwipe) {
    var r = S.round;
    if (!r || r.locked) return;
    r.locked = true;
    clearInterval(S._dwellTimer);

    var c = r.chars[r.idx];
    var dwell = performance.now() - r.cardShownAt;
    var status = side === 'know' ? 'known' : 'unknown';

    r.marks[c] = status;
    r.dwells.push(dwell);

    // 本地乐观更新（不等后端，界面立刻反映）
    var p = S.progress[c] || { st: null, k: 0, u: 0, t: 0 };
    p.st = status;
    if (status === 'known') p.k++; else p.u++;
    p.t = Date.now();
    S.progress[c] = p;

    // 积分只奖励「完成」，不奖励「认识」
    var tooFast = dwell < 400;
    var gain = tooFast ? 0 : 5;
    if (tooFast) { r.tooFast++; r.combo = 0; }
    else {
      r.combo++;
      if (r.combo % 5 === 0) { gain += 10; Sfx.combo(); floatText(window.innerWidth / 2 - 40, window.innerHeight * 0.36, '连击 +10', '#D98315'); }
      r.maxCombo = Math.max(r.maxCombo, r.combo);
    }
    var before = energy;
    energy += gain;
    r.energyGain += gain;
    saveEnergy();

    if (gain) {
      var card = $('#card');
      var rect = card ? card.getBoundingClientRect() : null;
      var fx = rect ? rect.left + rect.width / 2 - 16 : window.innerWidth / 2;
      var fy = rect ? rect.top + 14 : window.innerHeight / 2;
      // 注意：飘字要在卡片飞出前取位置
      floatText(fx, fy, '+' + gain, side === 'know' ? '#D98315' : '#5E7185');
    }
    if (side === 'know') { Sfx.know(); buzz(14); } else { Sfx.unk(); buzz(24); }
    if (titleRank(energy) > titleRank(before)) setTimeout(function () { showLevelUp(titleOf(energy)); }, 400);

    // 按钮 / 键盘通道：补一次和手势完全相同的飞出动画（含投放区闪光）
    if (!fromSwipe) {
      var fly = $('#card');
      if (fly) flyOut(fly, side, 0, null);
    }

    cleanupDrag();
    r.idx++;
    recalcStats();
    updateHud();
    setZoneGlow(null, 0);
    // 手势通道：answer() 本身是在 240ms 后才被调用的，沿用原来的节奏
    setTimeout(function () { renderCard(false); }, fromSwipe ? (tooFast ? 190 : 300) : 340);
  }

  function showLevelUp(name) {
    Sfx.levelup();
    var d = el('div', 'levelup', '<div class="inner"><div class="medal">' + svg('medal', 80) + '</div>' +
      '<div class="t1">能量满啦！新的称号是</div><div class="t2">' + esc(name) + '</div></div>');
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 2000);
  }

  /* ===========================================================
     结算 + 上传
     =========================================================== */
  function finishRound() {
    var r = S.round; if (!r) return;
    clearInterval(S._dwellTimer);
    energy += 20; r.energyGain += 20; saveEnergy();
    Sfx.finish();
    submitCurrentRound(false);
    var know = [], unk = [];
    r.chars.forEach(function (c) { if (r.marks[c] === 'known') know.push(c); else if (r.marks[c] === 'unknown') unk.push(c); });

    var answered = know.length + unk.length || 1;
    var avgDwell = r.dwells.length ? r.dwells.reduce(function (a, b) { return a + b; }, 0) / r.dwells.length : 0;
    var stars = 1;
    if (avgDwell >= 1200) stars++;
    if (r.maxCombo >= 10) stars++;
    if (r.tooFast > r.chars.length * 0.3) stars = 1;

    recalcStats();
    renderResult({
      kind: r.kind, levelNo: r.levelNo, mode: r.mode,
      know: know, unk: unk, avgDwell: avgDwell, stars: stars,
      unkTotal: S.stats.unknown, knownTotal: S.stats.known, remaining: S.stats.untested
    });
    S.round = null;
    show('result');
  }

  function submitCurrentRound(silent) {
    var r = S.round; if (!r || r.saved) return;
    r.saved = true;
    var payload = {
      kind: r.kind,
      levelNo: r.levelNo,
      mode: r.mode,
      marks: r.marks,
      avgDwell: r.dwells.length ? Math.round(r.dwells.reduce(function (a, b) { return a + b; }, 0) / r.dwells.length) : 0,
      stars: 0,
      device: navigator.platform || '',
      startedAt: r.startedAt,
      endedAt: Date.now()
    };
    apiPost('/round', payload).then(function (res) {
      if (res && res.progress) { S.progress = res.progress; if (res.stats) S.stats = res.stats; }
    }).catch(function () { queuePending(payload); });
  }

  function renderResult(res) {
    var stars = '';
    for (var i = 0; i < 3; i++) stars += '<svg viewBox="0 0 24 24" width="34" height="34"><g fill="' + (i < res.stars ? '#F08C1E' : '#E3DDD5') + '">' + icon('star') + '</g></svg>';

    var title = res.kind === 'practice' ? '练习完成！' : ('第 ' + res.levelNo + ' 关完成！');
    var learned = res.know.length;
    var res$ = $('#result');
    res$.innerHTML =
      '<div class="res-wrap">' +
        '<div class="res-head">' +
          '<div><h1>' + esc(title) + '</h1>' +
          '<div class="sub">' + new Date().toLocaleString('zh-CN') + '　·　' + (res.mode === 'parent' ? '家长判读' : '孩子自己滑') + '　·　平均每张 ' + (res.avgDwell / 1000).toFixed(1) + ' 秒</div></div>' +
          '<div class="stars">' + stars + '</div>' +
        '</div>' +

        '<div class="metrics">' +
          '<div class="metric know"><div class="k">' + svg('smile', 15, '#F08C1E') + '认识</div><div class="v">' + res.know.length + '<small>字</small></div></div>' +
          '<div class="metric unk"><div class="k">' + svg('ask', 15, '#5E7185') + '不认识</div><div class="v">' + res.unk.length + '<small>字</small></div></div>' +
          '<div class="metric new"><div class="k">累计认识</div><div class="v">' + res.knownTotal + '<small>字</small></div></div>' +
          '<div class="metric"><div class="k">还没测过</div><div class="v">' + res.remaining + '<small>字</small></div></div>' +
        '</div>' +

        '<div class="tip">' +
          (res.kind === 'practice'
            ? '练会了（这次答「认识」）的字已经进「我的字库」；还答错的会留在练习库里，下次优先再练。'
            : '答「认识」的字出了关卡池、进了「我的字库」；答「不认识」的进了练习库，下次按 10 个一组练。') +
        '</div>' +

        '<div class="res-cols">' +
          '<div class="card"><div class="list-head"><h3 class="c-know">这次认识的</h3><span class="n">' + res.know.length + ' 个</span></div>' + chips(res.know, 'know') + '</div>' +
          '<div class="card"><div class="list-head"><h3 class="c-unk">这次不认识的（进了练习库）</h3><span class="n">' + res.unk.length + ' 个</span></div>' + chips(res.unk, 'unk') + '</div>' +
        '</div>' +

        '<div class="res-actions">' +
          (res.remaining > 0 ? '<button class="btn primary" id="nextBtn">继续下一关</button>' : '') +
          (res.unkTotal > 0 ? '<button class="btn" id="practiceBtn">练一练（' + Math.min(10, res.unkTotal) + ' 个字）</button>' : '') +
          '<button class="btn ghost" id="homeBtn">回到首页</button>' +
          '<button class="btn ghost" id="libraryBtn">我的字库</button>' +
        '</div>' +
      '</div>';

    var nb = $('#nextBtn'); if (nb) nb.addEventListener('click', function () { Sfx.tap(); startLevelRound(); });
    var pb = $('#practiceBtn'); if (pb) pb.addEventListener('click', function () { Sfx.tap(); startPracticeRound(); });
    $('#homeBtn').addEventListener('click', function () { Sfx.tap(); show('home'); renderHome(); });
    $('#libraryBtn').addEventListener('click', function () { Sfx.tap(); renderLibrary(); });
  }

  function chips(list, cls) {
    if (!list.length) return '<div class="empty-tip">（没有）</div>';
    return '<div class="char-chips">' + list.map(function (c) {
      var i = S.byChar[c] || { p: '' };
      return '<div class="chip ' + cls + '"><div class="c">' + esc(c) + '</div><div class="p">' + esc(i.p || '') + '</div></div>';
    }).join('') + '</div>';
  }

  /* ===========================================================
     我的字库（已认识的字，可复习）
     =========================================================== */
  function renderLibrary() {
    var kn = knownList();
    var wrap = $('#library');
    wrap.innerHTML =
      '<div class="lib-wrap">' +
        '<div class="lib-top">' +
          '<button class="icon-btn" id="libBack">' + svg('arrowL', 20) + '</button>' +
          '<div><h1>我的字库</h1><div class="sub">已经认识的 ' + kn.length + ' 个字 · 点一下能看拼音和组词</div></div>' +
        '</div>' +
        (kn.length
          ? '<div class="lib-grid">' + kn.map(function (x) {
            return '<div class="lib-card"><div class="c">' + esc(x.c) + '</div>' +
              '<div class="p">' + esc(x.p || '') + '</div>' +
              '<div class="w">' + esc((x.w || []).slice(0, 3).join(' ')) + '</div></div>';
          }).join('') + '</div>'
          : '<div class="card" style="text-align:center"><div class="tip">还没有认识的字，先去测一测吧！</div></div>') +
      '</div>';
    $('#libBack').addEventListener('click', function () { Sfx.tap(); show('home'); renderHome(); });
    show('library');
  }

  /* ===========================================================
     设置抽屉
     =========================================================== */
  function openSheet() {
    Sfx.tap();
    var mask = $('#sheetMask'), sheet = $('#sheet');
    function sw(on) { return '<div class="switch ' + (on ? 'on' : '') + '"></div>'; }

    sheet.innerHTML =
      '<button class="icon-btn close" id="sheetClose">' + svg('close', 18) + '</button>' +
      '<h2>家长设置</h2>' +
      '<div class="sheet-sub">首页直接点「家长设置」进入；测试中需要<b>长按 2 秒</b>（防止孩子误入）。</div>' +

      '<div class="row" data-toggle="showPinyin"><div><div class="lab">卡片直接显示拼音</div><div class="desc">默认收起（点了才显示），避免把「认拼音」当成「认字」。练习模式下始终显示。</div></div><div class="ctl">' + sw(settings.showPinyin) + '</div></div>' +
      '<div class="row" data-toggle="sound"><div><div class="lab">音效</div><div class="desc">滑动、落位、连击、升级音</div></div><div class="ctl">' + sw(settings.sound) + '</div></div>' +

      '<div class="row" style="border:none"><div><div class="lab">重新同步数据</div><div class="desc">从云端重新拉取字表与进度</div></div><div class="ctl"><button class="btn sm" id="resyncBtn">重新同步</button></div></div>' +

      '<div class="sheet-sub" style="margin-top:18px">判定模式（谁来判）和当前进度都直接显示在首页，这里不再重复。这里是孩子端，只放孩子能看的设置；新增汉字、查看完整字库请在家长管理页操作。</div>';

    mask.classList.add('on'); sheet.classList.add('on');
    function close() { mask.classList.remove('on'); sheet.classList.remove('on'); }
    $('#sheetClose').addEventListener('click', close);
    mask.onclick = close;

    sheet.querySelectorAll('.row[data-toggle]').forEach(function (row) {
      row.style.cursor = 'pointer';
      row.addEventListener('click', function () {
        var k = row.dataset.toggle;
        settings[k] = !settings[k];
        if (k === 'sound' && settings.sound) Sfx.tap();
        saveSettings(); openSheet();
      });
    });
    $('#resyncBtn').addEventListener('click', function () {
      close(); loadBootstrap(true);
    });
  }

  /* ===========================================================
     启动
     =========================================================== */
  function loadBootstrap(isRetry) {
    S.loaded = false;
    if (isRetry) { show('home'); renderHome(); }
    return apiGet('/bootstrap').then(function (res) {
      S.chars = res.chars || [];
      S.byChar = {};
      S.chars.forEach(function (x) { S.byChar[x.c] = x; });
      S.progress = res.progress || {};
      S.sessions = res.sessions || [];
      S.stats = res.stats || {};
      S.config = res.config || S.config;
      recalcStats();
      S.loaded = true;
      flushPending();
      if (document.body.dataset.screen === 'home' || isRetry) { renderHome(); show('home'); }
    }).catch(function (e) {
      S.loaded = false;
      var wrap = $('#home');
      wrap.innerHTML = '<div class="home-wrap"><div class="card" style="text-align:center;padding:36px 24px">' +
        '<div class="brand-badge" style="margin:0 auto 14px;background:linear-gradient(180deg,#FFC46B,#F08C1E)"><span>字</span></div>' +
        '<h2 style="justify-content:center;font-size:18px">暂时连不上服务器</h2>' +
        '<div class="tip" style="margin:10px 0 18px">' + esc(e && e.message ? e.message : '网络异常') + '<br>请检查网络后重试。</div>' +
        '<button class="btn primary" id="retryBtn">重试</button></div></div>';
      var rb = $('#retryBtn'); if (rb) rb.addEventListener('click', function () { loadBootstrap(true); });
      show('home');
    });
  }

  document.addEventListener('keydown', function (e) {
    if (document.body.dataset.screen !== 'play' || !S.round) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); answer('know'); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); answer('unk'); }
    else if (e.key === ' ') { e.preventDefault(); var c = S.round.chars[S.round.idx]; if (c) Talk.say(c); }
  });

  function init() {
    renderHome();
    show('home');
    loadBootstrap();
    if (!settings.seenGuide) setTimeout(function () { if (S.loaded) showGuide(); }, 600);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

  window.__HZ = S;
})();

</script>
</body>
