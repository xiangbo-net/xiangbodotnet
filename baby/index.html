<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF9F0">
<title>汉字小侦探 · 4岁认字量测试</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23F08C1E'/%3E%3Ctext x='32' y='45' font-size='40' text-anchor='middle' fill='%23fff' font-family='Kaiti SC,serif'%3E字%3C/text%3E%3C/svg%3E">
<style>
/* ===========================================================
   汉字小侦探 —— 样式
   设计约束：
   · 4 岁儿童：卡片汉字尽可能大、点击目标大、无倒计时无失败感
   · 认识 = 暖橙（成就）；不认识 = 蓝灰（待解锁），刻意不使用红色
   · 色盲友好：颜色 + 图形双重编码
   · 主体为横屏平板 / 桌面浏览器，同时兼容竖屏
   =========================================================== */

:root{
  --know:#F08C1E; --know-soft:#FFF1DC; --know-line:#F5B95C;
  --unk:#5E7185;  --unk-soft:#EDF2F7;  --unk-line:#9FB3C8;
  --ink:#2C2824; --ink-2:#6B625A; --ink-3:#9C928A;
  --bg-1:#FFF9F0; --bg-2:#F0F6FA;
  --panel:#FFFFFF; --line:rgba(44,40,36,.12);
  --r-sm:10px; --r-md:16px; --r-lg:24px; --r-xl:34px;
  --shadow:0 8px 30px rgba(80,60,30,.10);
  --shadow-card:0 16px 44px rgba(70,55,30,.16);
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-hanzi:"Kaiti SC","STKaiti","KaiTi","Kaiti TC","Baoli SC",serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);color:var(--ink);
  background:linear-gradient(165deg,var(--bg-1) 0%,var(--bg-2) 100%);
  background-attachment:fixed;
  overflow:hidden;user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
/* 手机上干掉 300ms 点击延迟与双击缩放带来的位移感 */
button,.btn,.big-btn,.mode,.lv,.pill,.chip,.row{touch-action:manipulation}
h1,h2,h3,p{margin:0}

.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.hidden{display:none !important}

/* ---------------- 通用按钮 ---------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  padding:.85em 1.6em;border-radius:999px;font-size:17px;font-weight:600;
  background:#fff;border:1.5px solid var(--line);
  transition:transform .12s ease,box-shadow .18s ease,background .18s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(80,60,30,.10)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#FFB251,#F08C1E);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(240,140,30,.34)}
.btn.ghost{background:rgba(255,255,255,.7)}
.btn.lg{font-size:21px;padding:1em 2.4em}
.btn.sm{font-size:14px;padding:.55em 1.1em}
.btn .arrow{font-size:.85em;opacity:.55}

/* ===========================================================
   1. 首页
   =========================================================== */
#home{align-items:center;justify-content:center;padding:4vh 4vw;overflow:auto}
.home-wrap{width:min(1080px,100%);display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:16px;justify-content:center}
.brand-badge{
  width:70px;height:70px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(180deg,#FFC46B,#F08C1E);box-shadow:0 10px 24px rgba(240,140,30,.36);
}
.brand-badge span{font-family:var(--font-hanzi);font-size:42px;color:#fff;line-height:1;margin-top:4px}
.brand h1{font-size:34px;letter-spacing:.06em}
.brand p{font-size:14px;color:var(--ink-3);margin-top:4px}

.home-cards{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media (max-width:820px){.home-cards{grid-template-columns:1fr}}
.card{
  background:var(--panel);border-radius:var(--r-lg);padding:22px;
  box-shadow:var(--shadow);border:1px solid var(--line);
}
.card h2{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--know)}
.tip{font-size:13px;color:var(--ink-3);line-height:1.7}

.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:2px solid var(--line);border-radius:var(--r-md);padding:16px;text-align:left;background:#fff;transition:.16s;position:relative}
.mode .t{font-size:16px;font-weight:600;margin-bottom:6px}
.mode .d{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.mode.on{border-color:var(--know);background:var(--know-soft)}
.mode.on::after{content:"已选";position:absolute;top:10px;right:12px;font-size:11px;color:#fff;background:var(--know);border-radius:999px;padding:2px 8px}

.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.levelGrid-small{grid-template-columns:repeat(5,1fr)}
.lv{
  border:2px solid var(--line);border-radius:var(--r-sm);padding:10px 6px;background:#fff;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:.14s;
}
.lv .n{font-size:15px;font-weight:700}
.lv .s{font-size:10.5px;color:var(--ink-3)}
.lv.on{border-color:var(--know);background:var(--know-soft)}
.lv.done .n::after{content:" ✓";color:#3E8F4E;font-size:12px}

.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1.5px solid var(--line);border-radius:999px;padding:.5em 1.1em;font-size:14px;background:#fff}
.pill.on{border-color:var(--unk);background:var(--unk-soft);color:#31465C;font-weight:600}

.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.stat .k{font-size:12px;color:var(--ink-3)}
.stat .v{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:2px}

.home-actions{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap}

/* ===========================================================
   2. 测试页
   =========================================================== */
#play{padding:0}
/* 顶部状态条 */
.hud{
  flex:0 0 auto;display:flex;align-items:center;gap:18px;
  padding:12px 20px;background:rgba(255,255,255,.72);
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px);
}
.hud .prog-wrap{flex:1;max-width:420px}
.hud .prog-txt{font-size:12.5px;color:var(--ink-2);margin-bottom:5px;display:flex;justify-content:space-between}
.hud .prog-bar{height:8px;border-radius:999px;background:rgba(44,40,36,.09);overflow:hidden}
.hud .prog-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#FFC46B,#F08C1E);transition:width .35s cubic-bezier(.4,1.3,.5,1)}
.hud .counts{display:flex;gap:16px;font-size:14px;font-variant-numeric:tabular-nums}
.hud .counts b{font-weight:700}
.c-know{color:var(--know)} .c-unk{color:var(--unk)}
.hud .energy{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:#B8791A}
.hud .energy .bolt{width:16px;height:16px}
.hud .title-tag{font-size:12px;background:var(--know-soft);color:#96590E;border-radius:999px;padding:4px 11px;font-weight:600}
.hud .spacer{margin-left:auto}
.hud .mode-tag{font-size:12px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.8)}
.icon-btn:hover{background:#fff}
.icon-btn svg{width:19px;height:19px}

/* 三栏主区 */
.board{flex:1;display:grid;grid-template-columns:1fr minmax(280px,1.5fr) 1fr;gap:16px;padding:16px 20px 8px;min-height:0}

.zone{
  border-radius:var(--r-lg);border:2.5px dashed var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(255,255,255,.5);transition:transform .18s ease,background .18s ease,border-color .18s ease;
  position:relative;overflow:hidden;
}
.zone .z-icon{width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.zone .z-icon svg{width:100%;height:100%;display:block}
.zone .z-title{font-size:22px;font-weight:700;letter-spacing:.04em}
.zone .z-hint{font-size:12.5px;color:var(--ink-3)}
.zone .z-count{position:absolute;bottom:14px;font-size:12px;color:var(--ink-3)}
#zoneKnow{border-color:var(--know-line);background:linear-gradient(180deg,rgba(255,241,220,.55),rgba(255,255,255,.35))}
#zoneUnk{border-color:var(--unk-line);background:linear-gradient(180deg,rgba(237,242,247,.7),rgba(255,255,255,.35))}
#zoneKnow .z-title{color:#B4720F}
#zoneUnk .z-title{color:#42566A}
.zone.hot{transform:scale(1.035)}
#zoneKnow.hot{border-color:var(--know);background:var(--know-soft);box-shadow:inset 0 0 0 6px rgba(240,140,30,.10)}
#zoneUnk.hot{border-color:var(--unk);background:var(--unk-soft);box-shadow:inset 0 0 0 6px rgba(94,113,133,.10)}
.zone.flash-know{animation:flashKnow .5s ease}
.zone.flash-unk{animation:flashUnk .5s ease}
@keyframes flashKnow{0%{background:#FFE3B8}100%{background:linear-gradient(180deg,rgba(255,241,220,.55),rgba(255,255,255,.35))}}
@keyframes flashUnk{0%{background:#D8E3EE}100%{background:linear-gradient(180deg,rgba(237,242,247,.7),rgba(255,255,255,.35))}}

/* 卡片 */
.card-stage{position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
.hanzi-card{
  position:relative;width:100%;height:100%;max-width:520px;max-height:100%;
  background:var(--panel);border-radius:var(--r-xl);box-shadow:var(--shadow-card);
  border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  cursor:grab;touch-action:none;will-change:transform;
  transition:transform .34s cubic-bezier(.34,1.4,.5,1),opacity .3s ease;
}
.hanzi-card:active{cursor:grabbing}
.hanzi-card .glyph{
  font-family:var(--font-hanzi);
  font-size:clamp(120px,26vh,260px);line-height:1.02;letter-spacing:.02em;
  color:#26221E;text-shadow:0 2px 0 rgba(0,0,0,.03);
}
.hanzi-card .sub{display:flex;align-items:center;gap:12px;min-height:34px}
.hanzi-card .pinyin{
  font-size:26px;color:var(--unk);letter-spacing:.06em;font-weight:600;font-variant-numeric:tabular-nums;
  opacity:0;transform:translateY(6px);transition:.22s;
}
.hanzi-card .pinyin.show{opacity:1;transform:none}
.hanzi-card .reveal{
  border:1.5px solid var(--line);border-radius:999px;padding:.35em 1em;font-size:13.5px;color:var(--ink-2);background:#fff;
}
.hanzi-card .reveal:hover{background:var(--unk-soft)}
.hanzi-card .speak{
  position:absolute;top:16px;right:16px;width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;background:var(--know-soft);border:1px solid var(--know-line);
}
.hanzi-card .speak svg{width:22px;height:22px}
.hanzi-card .speak:hover{background:#FFE6C2}
.hanzi-card .dwell{position:absolute;left:18px;bottom:14px;font-size:11.5px;color:var(--ink-3);opacity:.75}
.hanzi-card.dragging{transition:none;cursor:grabbing;box-shadow:0 26px 60px rgba(70,55,30,.22)}
.hanzi-card .tilt{transition:transform .15s}
.hanzi-card.fly-know{transform:translate(var(--fx),var(--fy)) scale(.42) rotate(-14deg);opacity:0}
.hanzi-card.fly-unk{transform:translate(var(--fx),var(--fy)) scale(.42) rotate(14deg);opacity:0}
.hanzi-card.enter{animation:cardIn .34s cubic-bezier(.34,1.4,.5,1)}
@keyframes cardIn{from{transform:translateY(26px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.card-empty{color:var(--ink-3);font-size:15px}

/* 判读模式提示条 */
.judge-hint{
  position:absolute;top:-2px;left:50%;transform:translateX(-50%);
  background:#3F5A73;color:#fff;border-radius:999px;padding:6px 16px;font-size:12.5px;
  box-shadow:0 6px 16px rgba(63,90,115,.28);white-space:nowrap;z-index:3;
}

/* 底部兜底按钮 */
.actions{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:18px;padding:8px 20px 18px;
}
.big-btn{
  display:flex;align-items:center;gap:12px;padding:14px 30px;border-radius:999px;font-size:19px;font-weight:700;
  border:2px solid transparent;transition:transform .12s ease,box-shadow .18s ease;
}
.big-btn:active{transform:scale(.96)}
.big-btn .k{font-size:12px;opacity:.65;font-weight:500}
.big-btn.know{background:linear-gradient(180deg,#FFC46B,#F08C1E);color:#fff;box-shadow:0 10px 24px rgba(240,140,30,.32)}
.big-btn.unk{background:linear-gradient(180deg,#8496A8,#5E7185);color:#fff;box-shadow:0 10px 24px rgba(94,113,133,.28)}
.big-btn .bd{width:26px;height:26px}

/* 连击飘字 */
.toast-layer{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.float{
  position:absolute;font-weight:700;font-size:24px;color:#E1851A;
  animation:floatUp 1s cubic-bezier(.2,1,.4,1) forwards;text-shadow:0 2px 8px rgba(255,255,255,.8);
}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px) scale(.8)}25%{opacity:1;transform:translateY(-10px) scale(1.06)}100%{opacity:0;transform:translateY(-70px) scale(1)}}
.levelup{
  position:fixed;inset:0;display:grid;place-items:center;z-index:70;pointer-events:none;
}
.levelup .inner{
  background:rgba(255,255,255,.96);border-radius:var(--r-xl);padding:34px 52px;text-align:center;
  box-shadow:0 30px 70px rgba(70,55,30,.28);border:2px solid var(--know-line);
  animation:popIn .5s cubic-bezier(.3,1.5,.5,1);
}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.levelup .medal{width:84px;height:84px;margin:0 auto 12px}
.levelup .t1{font-size:14px;color:var(--ink-3)}
.levelup .t2{font-size:32px;font-weight:800;color:#B4720F;margin-top:4px;letter-spacing:.06em}

/* ===========================================================
   3. 结算页
   =========================================================== */
#result{overflow-y:auto;display:none}
#result.on{display:block}
.res-wrap{width:min(1120px,100%);margin:0 auto;padding:26px 22px 60px;display:flex;flex-direction:column;gap:18px}
.res-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.res-head h1{font-size:26px}
.res-head .sub{font-size:13.5px;color:var(--ink-3);margin-top:4px}
.stars{display:flex;gap:6px;margin-left:auto}
.stars svg{width:38px;height:38px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;box-shadow:0 4px 16px rgba(80,60,30,.05)}
.metric .k{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.metric .v{font-size:32px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.metric .v small{font-size:14px;font-weight:600;color:var(--ink-3);margin-left:3px}
.metric.know{border-color:var(--know-line);background:linear-gradient(180deg,#FFFAF2,#fff)}
.metric.know .v{color:#C67A11}
.metric.unk{border-color:var(--unk-line)}
.metric.unk .v{color:#455A6E}
.metric.new .v{color:#3E8F4E}
.res-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.res-cols{grid-template-columns:1fr}}
.list-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.list-head h3{font-size:15px}
.list-head .n{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.char-chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{
  min-width:56px;padding:8px 10px 6px;border-radius:var(--r-sm);text-align:center;
  border:1.5px solid var(--line);background:#fff;
}
.chip .c{font-family:var(--font-hanzi);font-size:32px;line-height:1.05}
.chip .p{font-size:11px;color:var(--ink-3);margin-top:3px;letter-spacing:.02em}
.chip.know{border-color:var(--know-line);background:var(--know-soft)}
.chip.unk{border-color:var(--unk-line);background:var(--unk-soft)}
.chip.new{border-color:#8CC79A;background:#EDF8F0}
.empty-tip{font-size:13px;color:var(--ink-3);padding:8px 2px}

.trend{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.trend svg{width:100%;height:180px;display:block}
.res-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* 复习卡打印区（屏幕上隐藏，打印时显示） */
.print-area{display:none}

/* ===========================================================
   4. 设置抽屉
   =========================================================== */
.sheet-mask{position:fixed;inset:0;background:rgba(40,32,24,.42);backdrop-filter:blur(3px);z-index:80;display:none}
.sheet-mask.on{display:block}
.sheet{
  position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:#fff;z-index:81;
  box-shadow:-20px 0 60px rgba(60,45,25,.2);padding:24px;overflow-y:auto;
  transform:translateX(105%);transition:transform .3s cubic-bezier(.3,1,.4,1);
}
.sheet.on{transform:none}
.sheet h2{font-size:19px;margin-bottom:4px}
.sheet .sheet-sub{font-size:12.5px;color:var(--ink-3);margin-bottom:20px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(44,40,36,.07)}
.row .lab{font-size:14.5px}
.row .desc{font-size:12px;color:var(--ink-3);margin-top:2px}
.row .ctl{margin-left:auto;display:flex;align-items:center;gap:8px}
.switch{width:50px;height:29px;border-radius:999px;background:#D8D3CC;position:relative;transition:.2s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.16)}
.switch.on{background:var(--know)}
.switch.on::after{transform:translateX(21px)}
.select{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:.45em .7em;font-size:14px;background:#fff;font-family:inherit}
.danger{color:#B03A2E;border-color:rgba(176,58,46,.4)}
.danger:hover{background:#FDF0EE}
.sheet .close{position:absolute;top:18px;right:18px}

/* 长按提示圈 */
.hold-ring{
  position:fixed;z-index:90;width:60px;height:60px;pointer-events:none;display:none;
}
.hold-ring.on{display:block}
.hold-ring circle{fill:none;stroke:var(--know);stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}

/* 首次进入手势提示 */
.guide{position:fixed;inset:0;z-index:75;display:grid;place-items:center;background:rgba(30,24,18,.5);backdrop-filter:blur(4px)}
.guide .box{background:#fff;border-radius:var(--r-lg);padding:30px 34px;max-width:560px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.3)}
.guide h2{font-size:20px;margin-bottom:10px}
.guide p{font-size:14px;color:var(--ink-2);line-height:1.8}
.guide .demo{display:flex;align-items:center;justify-content:center;gap:18px;margin:22px 0}
.guide .demo .mini{width:78px;height:100px;border-radius:14px;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--font-hanzi);font-size:44px}
.guide .demo .arw{font-size:24px;color:var(--ink-3)}

/* 滑动方向箭头（竖排的手機版面才顯示） */
.z-arrow{display:none;align-items:center;margin-left:6px}
.z-arrow svg{width:16px;height:16px;display:block}
.board.vert .z-arrow{display:inline-flex}
.demo-v{flex-direction:column !important;gap:12px;margin:16px 0}
.demo-v .mini{width:104px;height:126px;font-size:60px}
.v-lab{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2)}

.v-lab.down .v-arrow{background:var(--unk-soft);color:#42566A}

/* 竖屏适配（iPad 竖着拿，641–900px）：卡片在上，两个投放区在下方左右并排，
   保持「左=认识 / 右=不认识」映射一致，仍然是左右拖动 */
@media (orientation:portrait) and (min-width:641px) and (max-width:900px){
  .board{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;gap:12px;padding:12px 12px 6px}
  .card-stage{grid-column:1 / 3;grid-row:1;min-height:0}
  #zoneKnow{grid-column:1;grid-row:2}
  #zoneUnk{grid-column:2;grid-row:2}
  .zone{flex-direction:row;justify-content:center;padding:14px 12px;gap:10px}
  .zone .z-icon{width:34px;height:34px}
  .zone .z-title{font-size:17px}
  .zone .z-hint{display:none}
  .zone .z-count{position:static;margin-left:6px;font-size:11px}
  .hanzi-card .glyph{font-size:clamp(110px,24vh,220px)}
  .actions{gap:12px;padding:8px 12px 14px}
}
@media (max-width:640px){
  /* ---- 首页 ---- */
  /* 注意：内容超过一屏时 justify-content:center 会把顶部裁掉且滚不回来，
     手机上必须顶对齐（内容不足一屏时由 home-wrap 的间距自然铺开） */
  #home{padding:calc(14px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));align-items:stretch;justify-content:flex-start}
  .home-wrap{gap:14px}
  .brand{gap:12px;justify-content:flex-start}
  .brand-badge{width:56px;height:56px;border-radius:18px}
  .brand-badge span{font-size:34px}
  .brand h1{font-size:26px}
  .brand p{font-size:12.5px;line-height:1.5}
  .stat-strip{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:12px 14px;border-radius:14px}
  .stat .v{font-size:21px}
  .home-cards{grid-template-columns:1fr;gap:14px}
  .card{padding:16px;border-radius:18px}
  .mode-row{gap:10px}
  .mode{padding:13px}
  .mode .t{font-size:15px}
  .mode .d{font-size:12px;line-height:1.55}
  .mode.on::after{top:8px;right:9px;font-size:10px;padding:1px 7px}
  .level-grid{gap:7px}
  .lv{padding:9px 4px}
  .lv .n{font-size:13.5px}
  .lv .s{font-size:10px}
  .pill{padding:.45em .95em;font-size:13.5px}
  .home-actions{gap:10px}
  .btn.lg{width:100%;font-size:18px;padding:.95em 1.2em}
  .btn.sm{padding:.5em 1em}

  /* ---- 测试页顶部状态条：压成两行 ---- */
  .hud{gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;flex-wrap:wrap}
  .hud .icon-btn{order:1;width:42px;height:42px;border-radius:12px}
  .hud .counts{order:2;margin-left:auto;gap:14px;font-size:13.5px}
  .hud .energy{order:3;font-size:13.5px}
  .hud .icon-btn:last-child{order:4;margin-left:0}
  .hud .prog-wrap{order:5;flex:1 1 100%;max-width:none;margin-top:2px}
  .hud .prog-txt{margin-bottom:4px}
  .hud .title-tag,.hud .mode-tag{display:none}

  /* ---- 主区：上区 / 大卡 / 下区 竖向排列 ---- */
  .board{
    display:grid;grid-template-columns:1fr;
    grid-template-rows:minmax(58px,0.62fr) minmax(0,2.2fr) minmax(58px,0.62fr);
    gap:10px;padding:10px 12px 6px;min-height:0;
  }
  #zoneKnow{grid-column:1;grid-row:1}
  .card-stage{grid-column:1;grid-row:2;min-height:0}
  #zoneUnk{grid-column:1;grid-row:3}
  .zone{
    flex-direction:row;justify-content:center;align-items:center;gap:9px;
    padding:8px 12px;border-radius:18px;border-width:2px;
  }
  .zone .z-icon{width:28px;height:28px}
  .zone .z-title{font-size:16px}
  .zone .z-hint{font-size:11.5px}
  .zone .z-count{position:static;margin-left:0;font-size:11px}
  .zone.hot{transform:scale(1.02)}

  .hanzi-card{max-width:100%;border-radius:26px}
  .hanzi-card .glyph{font-size:clamp(84px,25vh,190px)}
  .hanzi-card .pinyin{font-size:22px}
  .hanzi-card .speak{width:44px;height:44px;top:12px;right:12px}
  .hanzi-card .dwell{left:14px;bottom:10px;font-size:11px}
  .judge-hint{font-size:11.5px;padding:5px 12px;top:0}

  /* ---- 底部兜底按钮：左右均分、够大好按 ---- */
  .actions{gap:10px;padding:6px 12px calc(10px + env(safe-area-inset-bottom))}
  .big-btn{flex:1 1 0;min-height:52px;justify-content:center;gap:8px;padding:12px 8px;font-size:16px;border-radius:18px}
  .big-btn .bd{width:22px;height:22px}
  .big-btn .k{font-size:11px}

  /* ---- 结算页 ---- */
  .res-wrap{padding:16px 14px calc(28px + env(safe-area-inset-bottom));gap:14px}
  .res-head{gap:12px}
  .res-head h1{font-size:21px}
  .res-head .sub{font-size:12px;line-height:1.6}
  .stars svg{width:30px;height:30px}
  .metrics{grid-template-columns:repeat(2,1fr);gap:10px}
  .metric{padding:13px 14px}
  .metric .v{font-size:26px}
  .metric .v small{font-size:12px}
  .res-cols{grid-template-columns:1fr;gap:12px}
  .chip{min-width:50px;padding:7px 9px 5px}
  .chip .c{font-size:28px}
  .trend{padding:14px;border-radius:18px}
  .trend svg{height:150px}
  .res-actions{gap:10px}
  .res-actions .btn{flex:1 1 auto;min-width:46%;font-size:15px}

  /* ---- 设置：改成底部抽屉 ---- */
  .sheet{
    top:auto;left:0;right:0;bottom:0;width:auto;max-height:86vh;
    border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(105%);box-shadow:0 -20px 60px rgba(60,45,25,.22);
  }
  .sheet.on{transform:none}
  .sheet::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:44px;height:4px;border-radius:999px;background:#DDD7CF}
  .sheet h2{margin-top:8px}
  .sheet .close{top:16px;right:14px}

  /* ---- 玩法说明 ---- */
  .guide .box{padding:22px 18px;margin:0 14px;border-radius:20px;max-width:none}
  .guide h2{font-size:18px}
  .guide p{font-size:13.5px}
  .guide .demo{gap:10px}
  .guide .demo .mini{width:64px;height:82px;font-size:36px}
}

/* 打印复习卡：只打印结算页里的复习卡区域 */
@media print{
  body{overflow:visible;background:#fff}
  .screen{display:none !important}
  #result.on{display:block !important}
  .res-wrap{padding:0;width:auto}
  .res-wrap > *:not(.print-area){display:none !important}
  .print-area{display:block !important;padding:0 4mm}
  .print-area h1{font-size:20pt;margin:0 0 10pt}
  .print-area .prow{display:flex;gap:10pt;padding:5pt 0;border-bottom:.5pt solid #ddd;align-items:baseline}
  .print-area .pchar{font-family:var(--font-hanzi);font-size:26pt;width:38pt;text-align:center}
  .print-area .ppy{font-size:13pt;color:#555;width:64pt}
  .print-area .pwd{font-size:12pt;color:#333}
  .print-area .pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8pt}
  .print-area .pgrid > div{display:flex;align-items:baseline;gap:6pt;border:0.5pt solid #e2e2e2;border-radius:4pt;padding:4pt 6pt}
  @page{margin:12mm}
}

  function unknownList() { return Object.keys(charState).filter(function (c) { return charState[c].last === 'unk' && CHAR_MAP[c]; }); }

  function renderHome() {
    var wrap = $('#home');
    var known = totalKnown();
    var reviewN = unknownList().length;
    var lv = DATA.groups[settings.level - 1];

    var v = vertMode();
    var modeCards = [
      { k: 'self', t: '孩子自己拖', d: v ? '孩子认识就往上滑，不认识往下滑。家长在旁边陪着就行。' : '孩子认识就往左拖，不认识往右拖。家长在旁边陪着就行。' },
      { k: 'parent', t: '家长判读（更准）', d: '让孩子把字读出来，家长点「读对了 / 没读对」。结果更可信。' }
    ].map(function (m) {
      return '<button class="mode ' + (settings.mode === m.k ? 'on' : '') + '" data-mode="' + m.k + '">' +
        '<div class="t">' + m.t + '</div><div class="d">' + m.d + '</div></button>';
    }).join('');

    var levels = DATA.groups.map(function (g) {
      var done = history.some(function (h) { return h.level === g.id; });
      return '<button class="lv ' + (settings.level === g.id ? 'on' : '') + (done ? ' done' : '') + '" data-level="' + g.id + '">' +
        '<span class="n">第' + g.id + '关</span><span class="s">' + g.avgStroke + '画</span></button>';
    }).join('');

    var perBtns = PER_ROUND_OPTIONS.map(function (n) {
      return '<button class="pill ' + (settings.perRound === n ? 'on' : '') + '" data-per="' + n + '">' + n + ' 张</button>';
    }).join('');

    wrap.innerHTML =
      '<div class="home-wrap">' +
        '<div class="brand">' +
          '<div class="brand-badge"><span>字</span></div>' +
          '<div><h1>汉字小侦探</h1><p>看看我认识多少个字 · 一共 ' + ALL.length + ' 个字，' + DATA.groups.length + ' 关，由简单到复杂</p></div>' +
        '</div>' +

        '<div class="stat-strip">' +
          '<div class="stat"><div class="k">累计认识</div><div class="v">' + known + '<small>字</small></div></div>' +
          '<div class="stat"><div class="k">待复习</div><div class="v">' + reviewN + '<small>字</small></div></div>' +
          '<div class="stat"><div class="k">能量</div><div class="v">' + energy + '</div></div>' +
          '<div class="stat"><div class="k">称号</div><div class="v" style="font-size:20px">' + titleOf(energy) + '</div></div>' +
        '</div>' +

        '<div class="home-cards">' +
          '<div class="card">' +
            '<h2><span class="dot"></span>怎么玩</h2>' +
            '<div class="mode-row">' + modeCards + '</div>' +
            '<h2 style="margin-top:20px"><span class="dot"></span>选关卡（越往后字越难）</h2>' +
            '<div class="level-grid">' + levels + '</div>' +
            '<div class="tip" style="margin-top:12px">当前第 ' + lv.id + ' 关共 ' + lv.chars.length + ' 字（' + lv.minStroke + '–' + lv.maxStroke + ' 画）。抽测会在这 100 字里均匀挑选，难度由简单到复杂。</div>' +
          '</div>' +
          '<div class="card">' +
            '<h2><span class="dot"></span>这一局测多少字</h2>' +
            '<div class="pill-row">' + perBtns + '</div>' +
            '<div class="tip" style="margin-top:14px">一局 20 张大约 5 分钟，适合 4 岁孩子的注意力时长。想全套测完可以分多次，进度会自动保存。</div>' +
            '<h2 style="margin-top:22px"><span class="dot"></span>上次没测完</h2>' +
            '<div id="resumeBox" class="tip"></div>' +
            '<h2 style="margin-top:22px"><span class="dot"></span>不知道怎么玩</h2>' +
            '<button class="btn sm ghost" id="guideBtn">看玩法说明</button>' +
          '</div>' +
        '</div>' +

        '<div class="home-actions">' +
          '<button class="btn lg primary" id="startBtn">开始测一测</button>' +
          (reviewN >= 5 ? '<button class="btn lg ghost" id="reviewBtn">只练不认识的 ' + reviewN + ' 个字</button>' : '') +
          '<button class="btn ghost" id="gearBtn" title="家长设置（长按 2 秒）">' + svg('gear', 18) + '家长设置</button>' +
        '</div>' +
      '</div>';

    // 事件
    wrap.querySelectorAll('[data-mode]').forEach(function (b) {
      b.addEventListener('click', function () { settings.mode = b.dataset.mode; saveSettings(); Sfx.tap(); renderHome(); });
    });
    wrap.querySelectorAll('[data-level]').forEach(function (b) {
      b.addEventListener('click', function () { settings.level = +b.dataset.level; saveSettings(); Sfx.tap(); renderHome(); });
    });
    wrap.querySelectorAll('[data-per]').forEach(function (b) {
      b.addEventListener('click', function () { settings.perRound = +b.dataset.per; saveSettings(); Sfx.tap(); renderHome(); });
    });
    $('#startBtn').addEventListener('click', function () { Sfx.unlock(); settings.review = false; saveSettings(); ensureGuideThen(startRound); });
    var rb = $('#reviewBtn');
    if (rb) rb.addEventListener('click', function () { Sfx.unlock(); settings.review = true; saveSettings(); ensureGuideThen(startRound); });
    $('#guideBtn').addEventListener('click', showGuide);
    bindGear($('#gearBtn'), true);

    // 续玩提示
    var box = $('#resumeBox');
    if (progress && progress.idx > 0 && progress.idx < progress.queue.length) {
      var left = progress.queue.length - progress.idx;
      box.innerHTML = '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
        '<span>上次测到第 ' + progress.idx + ' / ' + progress.queue.length + ' 张，还剩 <b>' + left + '</b> 张。</span>' +
        '<button class="btn sm" id="resumeBtn">继续测完</button>' +
        '<button class="btn sm ghost" id="dropBtn">不要了</button></div>';
      $('#resumeBtn').addEventListener('click', function () { settings.review = !!progress.review; settings.level = progress.level; settings.perRound = progress.perRound || settings.perRound; settings.mode = progress.mode || settings.mode; saveSettings(); resumeRound(); });
      $('#dropBtn').addEventListener('click', function () { progress = null; ls('progress', null); renderHome(); });
    } else {
      box.textContent = '没有未完成的测试。';
    }
    if (!Talk.available()) { box.innerHTML += '<div style="margin-top:10px;color:#B4720F">本设备没有找到中文语音，卡片上的朗读按钮已隐藏（不影响其他功能）。</div>'; }
  }

  // 长按 2 秒进入家长设置（allowClick：首页那一下可以直接点）
  function bindGear(btn, allowClick) {
    if (!btn) return;
    var t = null, ring = null;
    function clear() { if (t) { clearTimeout(t); t = null; } if (ring) { ring.remove(); ring = null; } }
    function down(e) {
      e.preventDefault();
      var r = btn.getBoundingClientRect();
      ring = el('div', 'hold-ring on', '<svg width="60" height="60"><circle cx="30" cy="30" r="24" stroke-dasharray="151" stroke-dashoffset="151"></circle></svg>');
      ring.style.left = (r.left + r.width / 2 - 30) + 'px';
      ring.style.top = (r.top + r.height / 2 - 30) + 'px';
      document.body.appendChild(ring);
      var c = ring.querySelector('circle');
      c.style.transition = 'stroke-dashoffset 2s linear';
      requestAnimationFrame(function () { c.style.strokeDashoffset = '0'; });
      t = setTimeout(function () { clear(); openSheet(); }, 2000);
    }
    btn.addEventListener('pointerdown', down);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { btn.addEventListener(ev, clear); });
    if (allowClick) btn.addEventListener('click', function () { clear(); openSheet(); });
  }

  /* ---------------- 玩法说明 ---------------- */
  function showGuide(force) {
    var v = vertMode();
    var demo = v
      ? '<div class="demo demo-v">' +
          '<div class="v-lab"><span class="v-arrow">↑</span>认识的字，往上滑</div>' +
          '<div class="mini">木</div>' +
          '<div class="v-lab down"><span class="v-arrow">↓</span>不认识的字，往下滑</div>' +
        '</div>'
      : '<div class="demo">' +
          '<div class="mini">木</div><div class="arw">←</div>' +
          '<div class="mini" style="border-color:#F5B95C;background:#FFF1DC;color:#B4720F">认识</div>' +
          '<div class="arw">·</div>' +
          '<div class="mini" style="border-color:#9FB3C8;background:#EDF2F7;color:#42566A">不认识</div>' +
          '<div class="arw">→</div><div class="mini">木</div>' +
        '</div>';
    var tip = v
      ? '看到中间的大字，<b>认识就把卡片往上滑</b>，<b>不认识就往下滑</b>。<br>' +
        '滑不动也没关系——下面两个大按钮点一下就行。<br>' +
        '点卡片右上角的小喇叭可以听这个字怎么读。'
      : '看到中间的大字，<b>认识就把卡片往左拖</b>，<b>不认识就往右拖</b>。<br>' +
        '拖不动也没关系——下面两个大按钮点一下就行。<br>' +
        '点卡片右上角的小喇叭可以听这个字怎么读。';
    var g = el('div', 'guide');
    g.innerHTML = '<div class="box">' +
      '<h2>怎么玩？</h2>' + demo +
      '<p>' + tip + '</p>' +
      '<div style="margin-top:20px"><button class="btn primary" id="gOk">我知道啦</button></div>' +
      '</div>';
    document.body.appendChild(g);
    g.querySelector('#gOk').addEventListener('click', function () {
      g.remove(); settings.seenGuide = true; saveSettings(); if (force === 'then') startRound();
    });
  }
  function ensureGuideThen(fn) { if (settings.seenGuide) fn(); else showGuide('then'); }

  /* ---------------- 出题 ---------------- */
  function buildQueue() {
    var pool;
    if (settings.review) {
      var cs = unknownList();
      if (cs.length < 1) { alert('暂时没有需要复习的字，先去测一测吧。'); return null; }
      pool = cs.map(function (c) { return CHAR_MAP[c]; });
    } else {
      pool = DATA.groups[settings.level - 1].chars;
    }
    var n = Math.min(settings.perRound, pool.length);
    var step = pool.length / n, picked = [];
    for (var i = 0; i < n; i++) picked.push(pool[Math.min(pool.length - 1, Math.floor(i * step))]);
    return picked.map(function (x) { return x.c; });
  }

  var round = null;

  function startRound() {
    var q = buildQueue();
    if (!q) return;
    var state = {};
    q.forEach(function (c) { state[c] = charState[c] ? charState[c].last : null; });
    round = {
      queue: q, idx: 0, marks: {}, dwells: [],
      level: settings.level, mode: settings.mode, perRound: settings.perRound,
      review: settings.review, energy: 0, combo: 0, maxCombo: 0,
      prevState: state, startedAt: Date.now(), cardShownAt: 0, locked: false, tooFast: 0
    };
    progress = { queue: q, idx: 0, marks: {}, level: round.level, mode: round.mode, perRound: round.perRound, review: round.review, energy: 0, prevState: state };
    saveProgress();
    show('play');
    paintPlayChrome();
    renderCard(true);
  }

  function resumeRound() {
    if (!progress) return;
    var state = {};
    progress.queue.forEach(function (c) { state[c] = charState[c] ? charState[c].last : null; });
    round = {
      queue: progress.queue, idx: progress.idx, marks: progress.marks || {}, dwells: [],
      level: progress.level, mode: progress.mode, perRound: progress.perRound || settings.perRound,
      review: !!progress.review, energy: progress.energy || 0, combo: 0, maxCombo: 0,
      prevState: progress.prevState || state, startedAt: Date.now(), cardShownAt: 0, locked: false, tooFast: 0
    };
    show('play');
    paintPlayChrome();
    renderCard(true);
  }

  function saveProgress() {
    if (!round) return;
    progress = {
      queue: round.queue, idx: round.idx, marks: round.marks, level: round.level, mode: round.mode,
      perRound: round.perRound, review: round.review, energy: round.energy, prevState: round.prevState
    };
    ls('progress', progress);
  }

  /* ---------------- 测试页外壳 ---------------- */
  // 按当前真实布局刷新：区域提示文案、方向箭头显示与否、底部按钮的键值提示
  function applyOrientation() {
    var board = $('.board');
    if (!board) return;
    var v = zoneVert();
    board.classList.toggle('vert', v);

    var parent = round && round.mode === 'parent';
    var hk = board.querySelector('[data-hint="know"]');
    var hu = board.querySelector('[data-hint="unk"]');
    if (hk) hk.textContent = v ? (parent ? '读对了往上放' : '往上滑到这里') : (parent ? '读对了 → 放这里' : '把卡片拖过来松手');
    if (hu) hu.textContent = v ? (parent ? '没读对往下放' : '往下滑到这里') : (parent ? '没读对 → 放这里' : '把卡片拖过来松手');

    var k1 = $('[data-key="know"]');
    var k2 = $('[data-key="unk"]');
    if (k1) k1.textContent = v ? '↑' : '←';
    if (k2) k2.textContent = v ? '↓' : '→';
  }

  function paintPlayChrome() {
    var modeTag = round.mode === 'parent' ? '家长判读模式' : '孩子自己拖';
    if (round.review) modeTag = '复习模式 · ' + modeTag;
    $('#play').innerHTML =
      '<div class="hud">' +
        '<button class="icon-btn" id="quitBtn" title="退出">' + svg('arrowL', 18) + '</button>' +
        '<div class="prog-wrap">' +
          '<div class="prog-txt"><span id="pgTxt">第 1 / ' + round.queue.length + ' 张</span><span id="pgLeft">还剩 ' + round.queue.length + ' 张</span></div>' +
          '<div class="prog-bar"><div class="prog-fill" id="pgFill"></div></div>' +
        '</div>' +
        '<div class="counts">' +
          '<span class="c-know">认识 <b id="nKnow">0</b></span>' +
          '<span class="c-unk">还不认识 <b id="nUnk">0</b></span>' +
        '</div>' +
        '<div class="energy">' + svg('bolt', 16, '#E1A02A') + '<span id="nEnergy">' + energy + '</span></div>' +
        '<span class="title-tag" id="tagTitle">' + titleOf(energy) + '</span>' +
        '<span class="mode-tag">' + modeTag + '</span>' +
        '<button class="icon-btn" id="gearBtn2" title="家长设置（长按 2 秒）">' + svg('gear', 18) + '</button>' +
      '</div>' +

      '<div class="board">' +
        '<div class="zone" id="zoneKnow">' +
          '<div class="z-icon">' + svg('smile', 56, '#F08C1E') + '</div>' +
          '<div class="z-title">我认识<span class="z-arrow">' + svg('chevU', 16, '#B4720F') + '</span></div>' +
          '<div class="z-hint" data-hint="know"></div>' +
          '<div class="z-count" id="zkCount">0 个字</div>' +
        '</div>' +
        '<div class="card-stage" id="stage"></div>' +
        '<div class="zone" id="zoneUnk">' +
          '<div class="z-icon">' + svg('ask', 56, '#5E7185') + '</div>' +
          '<div class="z-title">还不认识<span class="z-arrow">' + svg('chevD', 16, '#42566A') + '</span></div>' +
          '<div class="z-hint" data-hint="unk"></div>' +
          '<div class="z-count" id="zuCount">0 个字</div>' +
        '</div>' +
      '</div>' +

      '<div class="actions">' +
        '<button class="big-btn know" id="btnKnow">' + svg('thumb', 26, '#fff') + '<span>' + (round.mode === 'parent' ? '读对了' : '我认识') + '</span><span class="k" data-key="know">←</span></button>' +
        '<button class="big-btn unk" id="btnUnk">' + svg('ask', 26, '#fff') + '<span>' + (round.mode === 'parent' ? '没读对' : '还不认识') + '</span><span class="k" data-key="unk">→</span></button>' +
      '</div>' +
      '<div class="toast-layer" id="toasts"></div>';

    applyOrientation();

    $('#quitBtn').addEventListener('click', function () {
      if (confirm('先退出这一局吗？（进度会保存，下次可以继续）')) { saveProgress(); Sfx.tap(); show('home'); renderHome(); }
    });
    $('#btnKnow').addEventListener('click', function () { answer('know'); });
    $('#btnUnk').addEventListener('click', function () { answer('unk'); });
    bindGear($('#gearBtn2'));
    updateHud();
  }

  function updateHud() {
    if (!round) return;
    var answered = round.idx;
    var know = 0, unk = 0;
    Object.keys(round.marks).forEach(function (c) { if (round.marks[c] === 'know') know++; else unk++; });
    var total = round.queue.length;
    var f = $('#pgFill'); if (f) f.style.width = (answered / total * 100) + '%';
    var gt = $('#pgTxt'); if (gt) gt.textContent = '第 ' + Math.min(answered + 1, total) + ' / ' + total + ' 张';
    var gl = $('#pgLeft'); if (gl) gl.textContent = answered >= total ? '本局完成' : '还剩 ' + (total - answered) + ' 张';
    var nk = $('#nKnow'); if (nk) nk.textContent = know;
    var nu = $('#nUnk'); if (nu) nu.textContent = unk;
    var ne = $('#nEnergy'); if (ne) ne.textContent = energy;
    var tt = $('#tagTitle'); if (tt) tt.textContent = titleOf(energy);
    var zk = $('#zkCount'); if (zk) zk.textContent = know + ' 个字';
    var zu = $('#zuCount'); if (zu) zu.textContent = unk + ' 个字';
  }

  /* ---------------- 渲染一张卡 + 拖拽 ---------------- */
  function renderCard(first) {
    var stage = $('#stage');
    if (!stage) return;
    if (round.idx >= round.queue.length) { finishRound(); return; }
    var ch = round.queue[round.idx];
    var info = CHAR_MAP[ch] || { c: ch, p: '', s: 0, w: [] };

    stage.innerHTML =
      (round.mode === 'parent' ? '<div class="judge-hint">让孩子读出来，家长点「读对了 / 没读对」</div>' : '') +
      '<div class="hanzi-card enter" id="card">' +
        '<button class="speak" id="speakBtn" title="听读音">' + svg('speaker', 22, '#B4720F') + '</button>' +
        '<div class="glyph">' + ch + '</div>' +
        '<div class="sub">' +
          '<span class="pinyin ' + (settings.showPinyin ? 'show' : '') + '" id="py">' + (info.p || '') + '</span>' +
          '<button class="reveal" id="revealBtn">' + (round.mode === 'parent' ? '看答案' : '看拼音') + '</button>' +
        '</div>' +
        '<div class="dwell" id="dwellTxt"></div>' +
      '</div>';

    var card = $('#card');
    round.cardShownAt = performance.now();
    round.locked = false;

    $('#speakBtn').addEventListener('click', function (e) { e.stopPropagation(); Talk.say(ch); Sfx.tap(); });
    $('#revealBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      $('#py').classList.add('show');
      var ex = info.w && info.w.length ? '　组词：' + info.w.join('、') : '';
      e.target.textContent = '共 ' + info.s + ' 画' + ex;
      Talk.say(ch);
    });

    // 触摸/鼠标拖拽
    var drag = null;
    card.addEventListener('pointerdown', function (e) {
      if (round.locked) return;
      if (e.target.closest('.speak') || e.target.closest('.reveal')) return;
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, dy: 0, vert: zoneVert() };
      card.setPointerCapture(e.pointerId);
      card.classList.add('dragging');
      Sfx.pick();
    });
    card.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      drag.dx = e.clientX - drag.x; drag.dy = e.clientY - drag.y;
      // 竖排：主要跟手上下位移，横向只轻微跟随；横排反之
      card.style.transform = drag.vert
        ? 'translate(' + (drag.dx * 0.35) + 'px,' + drag.dy + 'px) rotate(' + (-drag.dx / 60) + 'deg)'
        : 'translate(' + drag.dx + 'px,' + (drag.dy * 0.35) + 'px) rotate(' + (drag.dx / 30) + 'deg)';
      var side = sideAt(e.clientX, e.clientY, card, drag.dx, drag.dy);
      $('#zoneKnow').classList.toggle('hot', side === 'know');
      $('#zoneUnk').classList.toggle('hot', side === 'unk');
    });
    function up(e) {
      if (!drag || e.pointerId !== drag.id) return;
      var dx = drag.dx, dy = drag.dy; drag = null;
      card.classList.remove('dragging');
      var side = sideAt(e.clientX, e.clientY, card, dx, dy);
      $('#zoneKnow').classList.remove('hot');
      $('#zoneUnk').classList.remove('hot');
      if (!side) { card.style.transform = ''; return; }
      fly(card, side, function () { answer(side); });
    }
    card.addEventListener('pointerup', up);
    card.addEventListener('pointercancel', function (e) { if (drag && e.pointerId === drag.id) { drag = null; card.classList.remove('dragging'); card.style.transform = ''; $('#zoneKnow').classList.remove('hot'); $('#zoneUnk').classList.remove('hot'); } });

    // 停留计时显示（给家长看：这张看了多久）
    clearInterval(round._dwellTimer);
    round._dwellTimer = setInterval(function () {
      var d = $('#dwellTxt');
      if (!d || !round || round.locked) return;
      var sec = (performance.now() - round.cardShownAt) / 1000;
      d.textContent = sec.toFixed(1) + ' 秒';
      d.style.opacity = sec > 8 ? '0.45' : '0.75';
    }, 200);

    if (first && settings.speak) setTimeout(function () { if (round && !round.locked) Talk.say(ch); }, 320);
  }

  // 判定落在哪一侧（比单纯看位移宽容很多，孩子拖偏了也算）
  // 竖排：上 = 认识，下 = 不认识；横排：左 = 认识，右 = 不认识
  function sideAt(px, py, card, dx, dy) {
    var zk = $('#zoneKnow').getBoundingClientRect();
    var zu = $('#zoneUnk').getBoundingClientRect();
    var r = card.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    function inside(z, x, y) { return x >= z.left && x <= z.right && y >= z.top && y <= z.bottom; }
    // 手指落点在某个区里，或卡片已经被拖到某个区里 → 直接判定
    if (inside(zk, px, py) || inside(zk, cx, cy)) return 'know';
    if (inside(zu, px, py) || inside(zu, cx, cy)) return 'unk';
    if (zoneVert()) {
      // 竖排：位移足够远且以纵向为主就算（手指短、滑不到区域也能命中）
      var tri = Math.max(56, r.height * 0.26);
      if (Math.abs(dy) > tri && Math.abs(dy) > Math.abs(dx) * 0.8) return dy < 0 ? 'know' : 'unk';
    } else {
      var half = r.width * 0.45;
      if (dx < -half) return 'know';
      if (dx > half) return 'unk';
    }
    return null;
  }

  function fly(card, side, done) {
    var zone = side === 'know' ? $('#zoneKnow') : $('#zoneUnk');
    var zr = zone.getBoundingClientRect(), cr = card.getBoundingClientRect();
    var fx = (zr.left + zr.width / 2) - (cr.left + cr.width / 2);
    var fy = (zr.top + zr.height / 2) - (cr.top + cr.height / 2);
    card.style.setProperty('--fx', fx + 'px');
    card.style.setProperty('--fy', fy + 'px');
    card.classList.remove('dragging');
    card.classList.add(side === 'know' ? 'fly-know' : 'fly-unk');
    zone.classList.add(side === 'know' ? 'flash-know' : 'flash-unk');
    setTimeout(function () { zone.classList.remove('flash-know', 'flash-unk'); }, 520);
    setTimeout(done, 300);
  }

  /* ---------------- 作答 ---------------- */
  function answer(side) {
    if (!round || round.locked) return;
    round.locked = true;
    clearInterval(round._dwellTimer);
    var ch = round.queue[round.idx];
    var dwell = performance.now() - round.cardShownAt;
    var tooFast = dwell < FAST_MS;

    round.marks[ch] = side;
    round.dwells.push(dwell);

    // 只奖励「完成」，不奖励「认识」
    var gain = tooFast ? 0 : 5;
    if (tooFast) { round.tooFast++; round.combo = 0; }
    else {
      round.combo++;
      if (round.combo > 0 && round.combo % 5 === 0) { gain += 10; Sfx.combo(); floatText(window.innerWidth / 2 - 40, window.innerHeight * 0.38, '连击 +10', '#D98315'); }
      round.maxCombo = Math.max(round.maxCombo, round.combo);
    }
    var before = energy;
    energy += gain;
    round.energy += gain;

    // 记录每个字的掌握状态
    var st = charState[ch] || { last: null, k: 0, u: 0 };
    if (side === 'know') { st.last = 'know'; st.k++; } else { st.last = 'unk'; st.u++; }
    charState[ch] = st;

    if (gain) {
      var card = $('#card');
      var r = card ? card.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2 };
      floatText(r.left + r.width / 2 - 16, r.top + 12, '+' + gain, side === 'know' ? '#D98315' : '#5E7185');
    }

    if (side === 'know') { Sfx.know(); buzz(14); } else { Sfx.unk(); buzz(26); }

    // 称号升级
    if (estimateLevel(energy) > estimateLevel(before)) setTimeout(function () { showLevelUp(titleOf(energy)); }, 420);

    round.idx++;
    saveProgress();
    saveAll();
    updateHud();
    setTimeout(function () { renderCard(false); }, tooFast ? 200 : 340);
  }

  function showLevelUp(name) {
    Sfx.levelup();
    var d = el('div', 'levelup', '<div class="inner"><div class="medal">' + svg('medal', 84) + '</div>' +
      '<div class="t1">升级啦！新的称号是</div><div class="t2">' + name + '</div></div>');
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 2100);
  }

  /* ---------------- 结算 ---------------- */
  function finishRound() {
    clearInterval(round._dwellTimer);
    energy += 20; round.energy += 20;
    var know = [], unk = [], fresh = [];
    round.queue.forEach(function (c) {
      if (round.marks[c] === 'know') know.push(c); else if (round.marks[c] === 'unk') unk.push(c);
    });
    // 新学会：上次记录是「不认识」，这次是「认识」
    know.forEach(function (c) { if (round.prevState[c] === 'unk') fresh.push(c); });

    var answered = know.length + unk.length || 1;
    var estimate = Math.round(know.length / answered * ALL.length);
    var knownAll = totalKnown();
    var avgDwell = round.dwells.length ? round.dwells.reduce(function (a, b) { return a + b; }, 0) / round.dwells.length : 0;
    var stars = 1;
    if (avgDwell >= DWELL_GOAL) stars++;
    if (round.maxCombo >= 10) stars++;
    if (round.tooFast > round.queue.length * 0.3) stars = 1;

    history.push({
      ts: Date.now(), level: round.level, mode: round.mode, review: round.review,
      n: round.queue.length, know: know.length, unk: unk.length, estimate: estimate, stars: stars
    });
    if (history.length > 200) history = history.slice(-200);
    ls('progress', null); progress = null;
    saveAll();
    Sfx.finish();
    renderResult({ know: know, unk: unk, fresh: fresh, estimate: estimate, knownAll: knownAll, avgDwell: avgDwell, stars: stars, mode: round.mode, review: round.review });
    show('result');
  }

  function chips(list, cls) {
    if (!list.length) return '<div class="empty-tip">（没有）</div>';
    return '<div class="char-chips">' + list.map(function (c) {
      var i = CHAR_MAP[c] || { p: '' };
      return '<div class="chip ' + cls + '"><div class="c">' + c + '</div><div class="p">' + (i.p || '') + '</div></div>';
    }).join('') + '</div>';
  }

  function renderResult(r) {
    var stars = '';
    for (var i = 0; i < 3; i++) stars += '<svg viewBox="0 0 24 24" width="38" height="38"><g fill="' + (i < r.stars ? '#F08C1E' : '#E3DDD5') + '">' + icon('star') + '</g></svg>';

    var res = $('#result');
    res.innerHTML =
      '<div class="res-wrap">' +
        '<div class="res-head">' +
          '<div>' +
            '<h1>本局完成！' + (r.review ? '（复习模式）' : '第 ' + round.level + ' 关') + '</h1>' +
            '<div class="sub">' + new Date().toLocaleString('zh-CN') + '　·　' + (r.mode === 'parent' ? '家长判读模式' : '孩子自己拖模式') + '　·　平均每张看 ' + (r.avgDwell / 1000).toFixed(1) + ' 秒</div>' +
          '</div>' +
          '<div class="stars">' + stars + '</div>' +
        '</div>' +

        '<div class="metrics">' +
          '<div class="metric know"><div class="k">' + svg('smile', 16, '#F08C1E') + '认识</div><div class="v">' + r.know.length + '<small>字</small></div></div>' +
          '<div class="metric unk"><div class="k">' + svg('ask', 16, '#5E7185') + '还不认识</div><div class="v">' + r.unk.length + '<small>字</small></div></div>' +
          '<div class="metric new"><div class="k">比上次新学会</div><div class="v">' + r.fresh.length + '<small>字</small></div></div>' +
          '<div class="metric"><div class="k">识字量估算</div><div class="v">' + r.estimate + '<small>字</small></div></div>' +
        '</div>' +
        '<div class="tip" style="margin-left:4px">识字量按本局「认识 / 已测」比例外推到全部 ' + ALL.length + ' 字，<b>是估算值</b>，不是精确测量；想更准就多测几局或把每局张数调大。累计认识（历史所有局）目前是 <b>' + r.knownAll + '</b> 字。</div>' +

        '<div class="res-cols">' +
          '<div class="card"><div class="list-head"><h3 class="c-know">认识的字</h3><span class="n">' + r.know.length + ' 个</span></div>' + chips(r.know, 'know') + '</div>' +
          '<div class="card"><div class="list-head"><h3 class="c-unk">还不认识的字（这些就是复习重点）</h3><span class="n">' + r.unk.length + ' 个</span></div>' + chips(r.unk, 'unk') + '</div>' +
        '</div>' +

        (r.fresh.length ? '<div class="card" style="border-color:#8CC79A;background:linear-gradient(180deg,#F5FCF7,#fff)"><div class="list-head"><h3 style="color:#3E8F4E">这次新学会的字</h3><span class="n">' + r.fresh.length + ' 个</span></div>' + chips(r.fresh, 'new') + '</div>' : '') +

        '<div class="trend"><div class="list-head"><h3>识字量估算变化</h3><span class="n">最近 ' + Math.min(history.length, 12) + ' 局</span></div>' + trendSvg() + '</div>' +

        '<div class="res-actions">' +
          '<button class="btn primary" id="againBtn">再来一局</button>' +
          (r.unk.length ? '<button class="btn" id="onlyUnkBtn">只练这 ' + r.unk.length + ' 个字</button>' : '') +
          '<button class="btn ghost" id="printBtn">打印复习卡（A4）</button>' +
          '<button class="btn ghost" id="csvBtn">导出成绩单 CSV</button>' +
          '<button class="btn ghost" id="homeBtn">回到首页</button>' +
        '</div>' +

        '<div class="print-area" id="printArea"></div>' +
      '</div>';

    $('#againBtn').addEventListener('click', function () { Sfx.tap(); startRound(); });
    var ou = $('#onlyUnkBtn');
    if (ou) ou.addEventListener('click', function () {
      r.unk.forEach(function (c) { charState[c] = charState[c] || { k: 0, u: 0 }; charState[c].last = 'unk'; });
      saveAll(); settings.review = true; settings.perRound = Math.max(10, r.unk.length); saveSettings(); startRound();
    });
    $('#printBtn').addEventListener('click', function () { buildPrint(r.unk); window.print(); });
    $('#csvBtn').addEventListener('click', function () { exportCsv(r); });
    $('#homeBtn').addEventListener('click', function () { Sfx.tap(); show('home'); renderHome(); });
  }

  function trendSvg() {
    var h = history.slice(-12);
    if (h.length < 2) return '<div class="empty-tip">测满两局就能看到变化曲线了。</div>';
    var W = 900, H = 180, P = 34;
    var max = Math.max.apply(null, h.map(function (x) { return x.estimate; }).concat([ALL.length]));
    var min = 0;
    var pts = h.map(function (x, i) {
      var px = P + (W - P * 2) * (i / (h.length - 1));
      var py = H - P - (H - P * 2) * ((x.estimate - min) / (max - min || 1));
      return [px, py, x];
    });
    var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    var area = d + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (H - P) + ' L' + pts[0][0].toFixed(1) + ' ' + (H - P) + ' Z';
    var grid = [0, 0.5, 1].map(function (f) {
      var y = H - P - (H - P * 2) * f;
      return '<line x1="' + P + '" y1="' + y + '" x2="' + (W - P) + '" y2="' + y + '" stroke="rgba(44,40,36,.09)" stroke-width="1"/>' +
        '<text x="' + (P - 8) + '" y="' + (y + 4) + '" font-size="11" fill="#9C928A" text-anchor="end">' + Math.round(min + (max - min) * f) + '</text>';
    }).join('');
    var dots = pts.map(function (p) {
      var dt = new Date(p[2].ts);
      return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4.5" fill="#F08C1E"/>' +
        '<text x="' + p[0].toFixed(1) + '" y="' + (H - 10) + '" font-size="10" fill="#9C928A" text-anchor="middle">' + (dt.getMonth() + 1) + '/' + dt.getDate() + '</text>';
    }).join('');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + grid +
      '<path d="' + area + '" fill="rgba(240,140,30,.12)"/>' +
      '<path d="' + d + '" fill="none" stroke="#F08C1E" stroke-width="2.5" stroke-linejoin="round"/>' + dots + '</svg>';
  }

  function buildPrint(list) {
    var html = '<h1>汉字复习卡 · 共 ' + list.length + ' 个字</h1>' +
      '<div class="prow" style="border-bottom:1pt solid #333"><span class="pchar">字</span><span class="ppy">拼音</span><span class="pwd">组词</span></div>' +
      '<div class="pgrid" style="margin-top:8pt">' +
      list.map(function (c) {
        var i = CHAR_MAP[c] || { p: '', w: [] };
        return '<div><span class="pchar">' + c + '</span><span class="ppy">' + (i.p || '') + '</span></div>';
      }).join('') + '</div>' +
      '<h1 style="margin-top:18pt">组词参考</h1>' +
      list.map(function (c) {
        var i = CHAR_MAP[c] || { p: '', w: [] };
        return '<div class="prow"><span class="pchar">' + c + '</span><span class="ppy">' + (i.p || '') + '</span><span class="pwd">' + ((i.w || []).join('、') || '—') + '</span></div>';
      }).join('');
    $('#printArea').innerHTML = html;
  }

  function exportCsv(r) {
    var rows = [['结果', '汉字', '拼音', '笔画', '部首', '结构', '组词', '关卡']];
    r.know.forEach(function (c) { var i = CHAR_MAP[c]; rows.push(['认识', c, i.p, i.s, i.r, i.st, (i.w || []).join('|'), '第' + i.level + '关']); });
    r.unk.forEach(function (c) { var i = CHAR_MAP[c]; rows.push(['不认识', c, i.p, i.s, i.r, i.st, (i.w || []).join('|'), '第' + i.level + '关']); });
    rows.push([]);
    rows.push(['本局统计', '认识 ' + r.know.length + ' 字', '不认识 ' + r.unk.length + ' 字', '识字量估算 ' + r.estimate, '', '', '', '']);
    var csv = rows.map(function (row) { return row.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
    var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    var d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = '汉字小侦探-' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
  }

  /* ---------------- 设置抽屉 ---------------- */
  function openSheet() {
    Sfx.tap();
    var mask = $('#sheetMask');
    var sheet = $('#sheet');
    function sw(on) { return '<div class="switch ' + (on ? 'on' : '') + '"></div>'; }
    var levels = DATA.groups.map(function (g) {
      return '<option value="' + g.id + '"' + (settings.level === g.id ? ' selected' : '') + '>第 ' + g.id + ' 关（' + g.avgStroke + ' 画，' + g.chars.length + ' 字）</option>';
    }).join('');
    var pers = PER_ROUND_OPTIONS.map(function (n) {
      return '<option value="' + n + '"' + (settings.perRound === n ? ' selected' : '') + '>' + n + ' 张</option>';
    }).join('');

    sheet.innerHTML =
      '<button class="icon-btn close" id="sheetClose">' + svg('close', 18) + '</button>' +
      '<h2>家长设置</h2>' +
      '<div class="sheet-sub">首页直接点齿轮即可进入；测试中需要长按 2 秒（防止孩子误点）。</div>' +

      '<div class="row"><div><div class="lab">判定模式</div><div class="desc">家长判读更准确，适合正式记录</div></div>' +
        '<div class="ctl"><select class="select" id="setMode">' +
          '<option value="self"' + (settings.mode === 'self' ? ' selected' : '') + '>孩子自己拖</option>' +
          '<option value="parent"' + (settings.mode === 'parent' ? ' selected' : '') + '>家长判读</option>' +
        '</select></div></div>' +

      '<div class="row"><div><div class="lab">当前关卡</div><div class="desc">关卡内按笔画由少到多</div></div><div class="ctl"><select class="select" id="setLevel">' + levels + '</select></div></div>' +

      '<div class="row"><div><div class="lab">每局张数</div><div class="desc">4 岁建议 20 张以内</div></div><div class="ctl"><select class="select" id="setPer">' + pers + '</select></div></div>' +

      '<div class="row" data-toggle="showPinyin"><div><div class="lab">卡片直接显示拼音</div><div class="desc">默认不显示（点了才显示），避免把「认拼音」当成「认字」</div></div><div class="ctl">' + sw(settings.showPinyin) + '</div></div>' +

      '<div class="row" data-toggle="sound"><div><div class="lab">音效</div><div class="desc">拖动、落位、连击、升级音</div></div><div class="ctl">' + sw(settings.sound) + '</div></div>' +
      '<div class="row" data-toggle="speak"><div><div class="lab">自动朗读汉字</div><div class="desc">' + (Talk.available() ? '每张卡出现时朗读读音' : '本设备没有中文语音，不可用') + '</div></div><div class="ctl">' + sw(settings.speak && Talk.available()) + '</div></div>' +

      '<div class="row"><div><div class="lab">累计认识</div><div class="desc">历史所有局去重后认识的字</div></div><div class="ctl"><b style="font-size:18px">' + totalKnown() + ' 字</b></div></div>' +
      '<div class="row"><div><div class="lab">测试记录</div><div class="desc">已保存 ' + history.length + ' 局</div></div><div class="ctl"><button class="btn sm danger" id="clearHist">清空记录</button></div></div>' +
      '<div class="row" style="border:none"><div><div class="lab">全部重置</div><div class="desc">清空认识/不认识、能量、历史、进度</div></div><div class="ctl"><button class="btn sm danger" id="clearAll">全部重置</button></div></div>';
    mask.classList.add('on'); sheet.classList.add('on');

    function close() { mask.classList.remove('on'); sheet.classList.remove('on'); }
    $('#sheetClose').addEventListener('click', close);
    mask.onclick = close;

    $('#setMode').addEventListener('change', function (e) { settings.mode = e.target.value; saveSettings(); });
    $('#setLevel').addEventListener('change', function (e) { settings.level = +e.target.value; saveSettings(); if (document.body.dataset.screen === 'home') renderHome(); });
    $('#setPer').addEventListener('change', function (e) { settings.perRound = +e.target.value; saveSettings(); });

    sheet.querySelectorAll('.row[data-toggle]').forEach(function (row) {
      row.style.cursor = 'pointer';
      row.addEventListener('click', function () {
        var k = row.dataset.toggle;
        if (k === 'speak' && !Talk.available()) { alert('本设备没有中文语音，无法开启朗读。'); return; }
        settings[k] = !settings[k];
        if (k === 'sound' && settings.sound) Sfx.tap();
        saveSettings(); openSheet();
      });
    });
    $('#clearHist').addEventListener('click', function () {
      if (confirm('清空所有测试记录（历史曲线会一起清掉）？认识/不认识的状态会保留。')) { history = []; ls('history', []); openSheet(); }
    });
    $('#clearAll').addEventListener('click', function () {
      if (confirm('确定全部重置吗？认识/不认识、能量、历史、未完成进度都会清空，无法恢复。')) {
        history = []; charState = {}; energy = 0; progress = null;
        ['history', 'chars', 'energy', 'progress'].forEach(function (k) { localStorage.removeItem(KEY + k); });
        openSheet();
      }
    });
  }

  /* ---------------- 键盘 ----------------
     横排：← 认识 / → 不认识；竖排（手机）：↑ 认识 / ↓ 不认识
     两者都接受，接蓝牙键盘或 iPad 外接键盘时都能用                     */
  document.addEventListener('keydown', function (e) {
    if (document.body.dataset.screen !== 'play' || !round) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); answer('know'); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); answer('unk'); }
    else if (e.key === ' ') { e.preventDefault(); var c = round.queue[round.idx]; if (c) Talk.say(c); }
  });

  /* ---------------- 旋转屏幕 / 改变窗口 ----------------
     版面在三栏与竖排之间切换时，重新套用提示文案与手势方向         */
  var rzTimer = null;
  function onViewportChange() {
    clearTimeout(rzTimer);
    rzTimer = setTimeout(function () {
      var s = document.body.dataset.screen;
      if (s === 'play') applyOrientation();
      else if (s === 'home') renderHome();
    }, 180);
  }
  window.addEventListener('resize', onViewportChange);
  window.addEventListener('orientationchange', onViewportChange);

  /* ---------------- 启动 ---------------- */
  function init() {
    // 首次使用：给出使用须知
    renderHome();
    show('home');
    if (!settings.seenGuide) setTimeout(function () { showGuide(); }, 400);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

  window.__HZ = { setLevel: function (n) { settings.level = n; saveSettings(); renderHome(); } };
})();

</script>
</body>
