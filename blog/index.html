<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博客建设中｜张相波</title>
<meta name="description" content="张相波个人博客正在建设中，将陆续收录组织效能、合伙机制、流程再造与企业 AI 方面的观察、判断和实践笔记。">
<meta name="robots" content="noindex">
<style>
:root{--ink:#1b211e;--muted:#6b7570;--line:#e4e8e5;--brand:#1f6952;--canvas:#fbfbf9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;background:var(--canvas);color:var(--ink);font:17px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;width:min(880px,calc(100% - 48px));margin:0 auto;padding:72px 0}
.wrap:before{content:"";position:absolute;width:560px;height:560px;top:-230px;right:-250px;border:1px solid rgba(31,105,82,.14);border-radius:50%;pointer-events:none}
.bar{display:flex;align-items:center;gap:11px;margin-bottom:58px}
.mark{display:grid;width:34px;height:34px;place-items:center;color:#fff;border-radius:9px;background:var(--brand);font-size:17px;font-weight:800}
.name{font-size:16px;font-weight:800;letter-spacing:-.01em}
.eyebrow{margin:0 0 16px;color:var(--brand);font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
h1{margin:0;font-size:clamp(36px,6vw,58px);font-weight:800;line-height:1.08;letter-spacing:-.045em}
.lead{max-width:610px;margin:26px 0 0;color:var(--muted);font-size:clamp(16px,1.6vw,18px)}
.topics{display:flex;flex-wrap:wrap;gap:9px;margin-top:34px}
.topics span{padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#4a5651;font-size:14px;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:42px}
.btn{display:inline-flex;min-height:48px;align-items:center;padding:0 22px;border:1px solid transparent;border-radius:9px;background:var(--brand);color:#fff;font-size:15px;font-weight:750}
.btn.ghost{border-color:var(--line);background:#fff;color:var(--ink)}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:13px;text-align:center}
@media(max-width:620px){.wrap{width:min(100% - 32px,880px);padding:54px 0}.bar{margin-bottom:40px}.wrap:before{width:380px;height:380px;top:-180px;right:-190px}.actions .btn{flex:1 1 auto;justify-content:center}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="bar"><span class="mark">相</span><span class="name">张相波 · 个人博客</span></div>
    <p class="eyebrow">Coming soon</p>
    <h1>博客正在建设中</h1>
    <p class="lead">这里将陆续收录我在组织效能、合伙机制、流程再造与企业 AI 方面的观察、判断和实践笔记。目前正在整理过往材料，稍后与大家见面。</p>
    <div class="topics">
      <span>组织效能</span>
      <span>合伙与激励</span>
      <span>流程与经营</span>
      <span>企业 AI</span>
      <span>顾问手记</span>
    </div>
    <div class="actions">
      <a class="btn" href="mailto:me@xiangbo.net">写信给我</a>
      <a class="btn ghost" href="/">返回主站 →</a>
    </div>
  </div>
  <footer>© 2026 张相波 · 励拓咨询（深圳）有限公司</footer>
</body>
</html>
