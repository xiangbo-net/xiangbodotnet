*{margin:0;padding:0;box-sizing:border-box}

.lang-btn.active{background:var(--primary);color:#fff}

.page{max-width:1080px;margin:0 auto;padding:24px 24px 56px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 16px rgba(37,99,235,.06)}

.hero{margin-top:26px}
.hero-inner{padding:0 2px}
.hero-top{display:flex;gap:18px;align-items:flex-start}
.hero-mark{width:56px;height:56px;flex:none;border-radius:14px;background:var(--primary-soft);color:var(--primary-deep);display:flex;align-items:center;justify-content:center}
.hero-chip{display:inline-flex;align-items:center;gap:7px;background:var(--primary-soft);color:var(--primary-deep);font-size:12px;font-weight:600;padding:3px 12px;border-radius:999px;margin-bottom:10px;letter-spacing:.3px}
.chip-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);flex:none}

.subtitle{margin-top:8px;font-size:14px;color:var(--text-soft);max-width:680px}
.meta-bar{display:grid;grid-template-columns:repeat(4,1fr);margin-top:24px;border-top:1px solid var(--border);padding-top:18px}
.meta-item{border-left:1px solid var(--border);padding:0 18px}
.meta-item:first-child{border-left:0;padding-left:0}
.meta-label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--slate)}
.meta-value{display:block;font-size:14px;font-weight:600;color:var(--text);margin-top:3px;word-break:break-all}

.stat-card{position:relative;padding:20px 22px 18px;overflow:hidden}

.stat-card.st-success::before{background:var(--success)}
.stat-card.st-fail::before{background:var(--slate)}
.stat-card.st-time::before{background:var(--sky)}
.stat-icon{width:38px;height:38px;border-radius:10px;background:var(--primary-soft);color:var(--primary-deep);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.st-success .stat-icon{background:var(--success-soft);color:var(--success)}
.st-fail .stat-icon{background:var(--slate-soft);color:var(--slate)}
.st-time .stat-icon{background:#e0f2fe;color:#0284c7}
.stat-num{font-size:34px;font-weight:800;line-height:1.1;color:var(--primary-deep);font-variant-numeric:tabular-nums}
.st-success .stat-num{color:var(--success)}
.st-fail .stat-num{color:var(--slate)}
.stat-label{font-size:13px;color:var(--text-soft);font-weight:500;margin-top:4px}
